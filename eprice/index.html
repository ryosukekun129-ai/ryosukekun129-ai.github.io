<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>電子プライス作成</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #111827; color: #f9fafb; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  header { padding: 10px 14px 6px; display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 16px; margin: 0; }
  header .cnt { margin-left: auto; font-size: 15px; font-weight: 700; color: #fbbf24; }
  #pos { padding: 0 14px 8px; font-size: 14px; color: #d1d5db; }
  #pos .nm { display: block; font-size: 16px; font-weight: 700; color: #fff; margin-top: 2px; line-height: 1.35; min-height: 22px; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 6px 10px; }
  #card { background: #fff; border-radius: 16px; padding: 22px 10px 14px; width: 100%; max-width: 560px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #card.done { outline: 5px solid #22c55e; }
  canvas { width: 94%; height: auto; display: block; margin: 0 auto; }
  #jan { font-family: ui-monospace, Menlo, monospace; font-size: 30px; font-weight: 800; letter-spacing: .14em; color: #111827; margin-top: 8px; }
  #doneflag { font-size: 14px; font-weight: 800; color: #16a34a; height: 18px; margin-top: 2px; }
  footer { padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
  .navrow { display: flex; gap: 10px; }
  .nbtn { flex: 1; padding: 20px 0; font-size: 19px; font-weight: 900; border: none; border-radius: 14px; background: #374151; color: #fff; }
  .nbtn.next { background: #2563eb; }
  .nbtn:active { opacity: .75; }
  .subrow { display: flex; gap: 10px; margin-top: 10px; }
  .sbtn { flex: 1; padding: 13px 0; font-size: 15px; font-weight: 700; border: 2px solid #4b5563; border-radius: 12px; background: none; color: #e5e7eb; }
  .sbtn.on { background: #14532d; border-color: #22c55e; color: #bbf7d0; }
  #toc { position: fixed; inset: 0; background: rgba(0,0,0,.92); overflow-y: auto; padding: 14px; display: none; z-index: 20; }
  #toc.open { display: block; }
  #toc h2 { font-size: 16px; margin: 4px 0 10px; }
  .tg { font-size: 13px; font-weight: 900; color: #fbbf24; margin: 14px 0 6px; }
  .ti { background: #1f2937; border-radius: 10px; padding: 10px 12px; margin-bottom: 5px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .ti .no { color: #9ca3af; flex: none; width: 34px; text-align: right; }
  .ti .jn { font-family: ui-monospace, monospace; }
  .ti .ck { margin-left: auto; color: #22c55e; font-weight: 900; flex: none; }
  .ti.cur { outline: 2px solid #f59e0b; }
</style>
</head>
<body>
<header><h1>電子プライス作成</h1><span class="cnt" id="cnt"></span></header>
<div id="pos"><span id="posline"></span><span class="nm" id="proname"></span></div>
<div id="stage">
  <div id="card">
    <canvas id="bc" width="570" height="240"></canvas>
    <div id="jan"></div>
    <div id="doneflag"></div>
  </div>
</div>
<footer>
  <div class="navrow">
    <button class="nbtn" id="prev">＜ 前へ</button>
    <button class="nbtn next" id="next">次へ ＞</button>
  </div>
  <div class="subrow">
    <button class="sbtn" id="donebtn">✓ 変更済みにする</button>
    <button class="sbtn" id="tocbtn">目次（<span id="donecnt"></span>）</button>
  </div>
</footer>
<div id="toc"><h2>目次（タップで移動） <button class="sbtn" id="tocclose" style="float:right; width:auto; padding:8px 16px;">閉じる</button></h2><div id="tocbody"></div></div>
<script>
const ITEMS = [{"j": "4901548401730", "p": 12, "t": 1, "n": "桐灰不思議なくつ下レギュラー超薄手 黒 1足"}, {"j": "4901548600621", "p": 12, "t": 1, "n": "桐灰不思議な靴下レギュラー厚手フリー 1足"}, {"j": "4901548401723", "p": 12, "t": 1, "n": "桐灰不思議なくつ下ハイソックス超薄手 黒 1足"}, {"j": "4901548401709", "p": 12, "t": 1, "n": "桐灰不思議なくつ下ハイソックス 黒 1足"}, {"j": "4901548603455", "p": 12, "t": 1, "n": "足の冷えない不思議なレッグウォーマー 1足"}, {"j": "4901548604308", "p": 12, "t": 1, "n": "足の冷えない不思議なレッグウォーマー超ロング"}, {"j": "4550728046980", "p": 12, "t": 1, "n": "ホカロン パイルドットST ピンク 23-25cm"}, {"j": "4550728047758", "p": 12, "t": 1, "n": "ホカロン総パイル裏起毛毛布クルー2Pクロ 23-25cm"}, {"j": "4550728046409", "p": 12, "t": 1, "n": "ホカロン総パイル裏起毛毛布ショート2Pグレー 25-27cm"}, {"j": "4550667026142", "p": 12, "t": 2, "n": "ホカロンふわふわ裏起毛ハイソックス 22-25 チャコール"}, {"j": "4550667026159", "p": 12, "t": 2, "n": "ホカロンふわふわ裏起毛ハイソックス 22-25 ブラック"}, {"j": "4901020553261", "p": 12, "t": 2, "n": "ホカロン裏起毛ひざした丈 22-25 ブラック"}, {"j": "4550728046805", "p": 12, "t": 2, "n": "紳士ホカロン3P"}, {"j": "4550728047291", "p": 12, "t": 2, "n": "ホカロン無地ST3Pアソート 25-27cm"}, {"j": "4550728046867", "p": 12, "t": 2, "n": "婦人ホカロンピコット総パイルST クロ 23-25cm"}, {"j": "4550728046911", "p": 12, "t": 2, "n": "婦人ホカロンピコット総パイルST コン 23-25cm"}, {"j": "4550728016747", "p": 12, "t": 2, "n": "婦人ホカロン2P 23-25cm"}, {"j": "4550728047987", "p": 12, "t": 2, "n": "ホカロン底パイルライン3Pアソート 23-25cm"}, {"j": "4550728046768", "p": 12, "t": 2, "n": "ホカロン底パイル無地3Pアソート 25-27cm"}, {"j": "4901020511025", "p": 12, "t": 3, "n": "ホカロン裏起毛レギンス10分丈 M-L ブラック"}, {"j": "4901020511018", "p": 12, "t": 3, "n": "ホカロン裏起毛レギンス10分丈 L-LL ブラック"}, {"j": "4901020511001", "p": 12, "t": 3, "n": "ホカロン裏起毛タイツ M-L ブラック"}, {"j": "4901020510998", "p": 12, "t": 3, "n": "ホカロン裏起毛タイツ L-LL ブラック"}, {"j": "4550667026166", "p": 12, "t": 3, "n": "ホカロンふわふわ裏起毛ソックス 22-25 チャコール"}, {"j": "4550667026173", "p": 12, "t": 3, "n": "ホカロンふわふわ裏起毛ソックス 22-25 ブラック"}, {"j": "4550728046973", "p": 12, "t": 3, "n": "ホカロンルームカバーグレー 23-25cm"}, {"j": "4550728016068", "p": 12, "t": 3, "n": "婦人ホカロン毛布ソックスショート 23-25cm"}, {"j": "4550728014378", "p": 12, "t": 4, "n": "紳士ホカロン2P 24-26cm"}, {"j": "4550269275900", "p": 12, "t": 4, "n": "紳士ホカロン総パイル裏起毛クルー2P 24-26cm"}, {"j": "4975193017134", "p": 12, "t": 5, "n": "山形電気あんか 山形あんか"}, {"j": "4580884802908", "p": 12, "t": 5, "n": "アニマルフェイスカバー蓄熱式湯たんぽ 柴犬"}, {"j": "4580884802885", "p": 12, "t": 5, "n": "アニマルフェイスカバー蓄熱式湯たんぽ シマエナガ"}, {"j": "4571621446493", "p": 12, "t": 5, "n": "湯たんぽ専用カバー アニマルタイプ ぽかしば"}, {"j": "4571621446516", "p": 12, "t": 5, "n": "湯たんぽ専用カバー アニマルタイプ シマエナガ"}, {"j": "4975193018919", "p": 12, "t": 6, "n": "電気ストーブ ホワイト"}, {"j": "4580706231374", "p": 12, "t": 6, "n": "湯たんぽ カバーなし 1.8L ピンク"}, {"j": "4580706231367", "p": 12, "t": 6, "n": "湯たんぽ カバーなし 1.8L ベージュ"}];
const TABLES = {"L": ["0001101", "0011001", "0010011", "0111101", "0100011", "0110001", "0101111", "0111011", "0110111", "0001011"], "G": ["0100111", "0110011", "0011011", "0100001", "0011101", "0111001", "0000101", "0010001", "0001001", "0010111"], "R": ["1110010", "1100110", "1101100", "1000010", "1011100", "1001110", "1010000", "1000100", "1001000", "1110100"], "P": ["LLLLLL", "LLGLGG", "LLGGLG", "LLGGGL", "LGLLGG", "LGGLLG", "LGGGLL", "LGLGLG", "LGLGGL", "LGGLGL"]};
const VER = "2026-11-05-p12only";
const LSK = "eprice-state-" + VER;
let state = { i: 0, done: {} };
try { const s = JSON.parse(localStorage.getItem(LSK)); if (s && Array.isArray(ITEMS) && s.i < ITEMS.length) state = s; } catch (e) {}
let idx = state.i || 0;
const done = state.done || {};
function save() { try { localStorage.setItem(LSK, JSON.stringify({ i: idx, done })); } catch (e) {} }
function ean13(jan) {
  const d = jan.split("").map(Number);
  const par = TABLES.P[d[0]];
  let bits = "101";
  for (let k = 1; k <= 6; k++) bits += TABLES[par[k - 1]][d[k]];
  bits += "01010";
  for (let k = 7; k <= 12; k++) bits += TABLES.R[d[k]];
  bits += "101";
  return bits;
}
function draw(jan) {
  const cv = document.getElementById("bc"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, bits = ean13(jan);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const quiet = 30, mw = (W - quiet * 2) / 95;
  ctx.fillStyle = "#000";
  for (let i = 0; i < 95; i++) {
    if (bits[i] === "1") {
      const long = (i < 3 || (i >= 46 && i < 50) || i >= 92) ? 18 : 0;
      ctx.fillRect(quiet + i * mw, 6, Math.ceil(mw), H - 12 + long > H ? H - 6 : H - 30 + long);
    }
  }
}
function render() {
  const it = ITEMS[idx];
  draw(it.j);
  document.getElementById("jan").textContent = it.j;
  document.getElementById("posline").textContent = "資料p" + it.p + " ／ 上から" + it.t + "段目";
  document.getElementById("proname").textContent = it.n || "";
  document.getElementById("cnt").textContent = (idx + 1) + " / " + ITEMS.length;
  const isDone = !!done[idx];
  document.getElementById("card").classList.toggle("done", isDone);
  document.getElementById("doneflag").textContent = isDone ? "✓ 変更済み" : "";
  const db = document.getElementById("donebtn");
  db.textContent = isDone ? "✓ 済み（タップで戻す）" : "✓ 変更済みにする";
  db.classList.toggle("on", isDone);
  const dc = Object.keys(done).length;
  document.getElementById("donecnt").textContent = "済み " + dc + "件";
  save();
}
function go(d) { idx = Math.min(ITEMS.length - 1, Math.max(0, idx + d)); render(); }
document.getElementById("next").addEventListener("click", () => go(1));
document.getElementById("prev").addEventListener("click", () => go(-1));
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
let tx = null;
const stage = document.getElementById("stage");
stage.addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (dx < -45) go(1); else if (dx > 45) go(-1);
}, { passive: true });
document.getElementById("donebtn").addEventListener("click", () => { if (done[idx]) delete done[idx]; else done[idx] = 1; render(); });
function buildToc() {
  const body = document.getElementById("tocbody");
  let html = "", g = "";
  ITEMS.forEach((it, i) => {
    const grp = "資料p" + it.p + " ／ 上から" + it.t + "段目";
    if (grp !== g) { g = grp; html += '<div class="tg">' + grp + "</div>"; }
    html += '<div class="ti' + (i === idx ? " cur" : "") + '" data-i="' + i + '"><span class="no">' + (i + 1) + '</span><span class="jn">' + it.j + "</span><span>" + (it.n || "") + '</span>' + (done[i] ? '<span class="ck">✓済</span>' : "") + "</div>";
  });
  body.innerHTML = html;
  body.querySelectorAll(".ti").forEach(el => el.addEventListener("click", () => {
    idx = +el.dataset.i; render();
    document.getElementById("toc").classList.remove("open");
  }));
}
document.getElementById("tocbtn").addEventListener("click", () => { buildToc(); document.getElementById("toc").classList.add("open"); });
document.getElementById("tocclose").addEventListener("click", () => document.getElementById("toc").classList.remove("open"));
if (navigator.wakeLock) { const req = () => navigator.wakeLock.request("screen").catch(() => {}); document.addEventListener("click", req, { once: true }); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") req(); }); }
render();
</script>
</body>
</html>
