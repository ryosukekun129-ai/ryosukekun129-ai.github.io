<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シフト管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f2937">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--sub:#6b7280;--line:#e5e7eb;--acc:#2563eb;--brk:#f59e0b;--sup:#7c3aed;--off:#9ca3af}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{background:#1f2937;color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:10}
header h1{font-size:19px}
header .month{font-size:13px;opacity:.85;margin-top:2px}
nav.tabs{display:flex;background:#1f2937;position:sticky;top:57px;z-index:10}
nav.tabs button{flex:1;background:none;border:none;color:#d1d5db;font-size:14px;padding:10px 0;border-bottom:3px solid transparent}
nav.tabs button.on{color:#fff;border-bottom-color:var(--acc);font-weight:700}
main{padding:12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav button{background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:16px;padding:6px 14px}
.daynav .dlabel{font-size:17px;font-weight:700}
.daynav .today{font-size:12px;color:var(--acc);border-color:var(--acc)}
.my{border-left:5px solid var(--acc)}
.my .big{font-size:21px;font-weight:800;margin:4px 0}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.b-sup{background:#ede9fe;color:var(--sup);border:1px solid #ddd6fe}
.b-chg{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.mut{color:var(--sub);font-size:13px}
h3{font-size:14px;margin-bottom:8px;color:#374151}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;font-size:12px}
.tl{position:relative;margin-top:4px}
.tlrow{display:flex;align-items:center;margin:5px 0}
.tlname{width:64px;font-size:12px;flex:none;white-space:nowrap;overflow:hidden}
.tlbar{position:relative;flex:1;height:16px;background:#eef2f7;border-radius:4px}
.seg{position:absolute;top:0;height:16px;background:#93c5fd;border-radius:4px}
.seg.brk{background:var(--brk)}
.tlhead{position:relative;height:14px;margin-left:64px;font-size:10px;color:var(--sub)}
.tlhead span{position:absolute;transform:translateX(-50%)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fffbeb;border:1px solid #fde68a;border-radius:999px;padding:3px 10px;font-size:12.5px}
.warn{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#991b1b;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:56px;padding:4px;font-size:11px;cursor:pointer}
.cell.empty{background:none;border:none;cursor:default}
.cell .dn{font-size:13px;font-weight:700}
.cell.work .dn{color:var(--acc)}
.cell.off{color:var(--off)}
.cell.sup{border-color:#ddd6fe;background:#f5f3ff}
.cell.sel{outline:2px solid var(--acc)}
.cell .tm{color:var(--sub)}
.sun{color:#dc2626}.sat{color:#2563eb}
.note{font-size:13px;line-height:1.7;padding-left:18px}
.note li{margin-bottom:6px}
.foot{text-align:center;color:var(--sub);font-size:11px;padding:8px 0 20px}
</style>
</head>
<body>
<header><h1>シフト管理</h1><div class="month" id="monthLabel"></div></header>
<nav class="tabs">
<button data-tab="day" class="on">日別</button>
<button data-tab="cal">カレンダー</button>
<button data-tab="mem">メンバー</button>
<button data-tab="rule">休憩ルール</button>
</nav>
<main>
<section id="view-day"></section>
<section id="view-cal" hidden></section>
<section id="view-mem" hidden></section>
<section id="view-rule" hidden></section>
<div class="foot" id="foot"></div>
</main>

const WD = ["日","月","火","水","木","金","土"];
const [Y, M] = DATA.month.split("-").map(Number);
let sel = (()=>{ const n=new Date(); return (n.getFullYear()===Y && n.getMonth()+1===M) ? n.getDate() : 1; })();
let tab = "day";
document.getElementById("monthLabel").textContent = DATA.monthLabel + "｜サンドラッグ片縄店";
document.getElementById("foot").textContent = "データ更新：" + DATA.updated + "（シフト変更時・月次登録時のみ更新）";
function wd(d){ return WD[new Date(Y, M-1, d).getDay()]; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function brkOf(name, d){ return DATA.days[d].breaks.filter(b=>b.name===name); }
function brkText(name, d){ const b=brkOf(name,d); return b.length ? b.map(x=>x.start+"〜"+x.end).join("、") : ""; }

function renderDay(){
  const d = String(sel), day = DATA.days[d], ik = day.ikeda;
  let h = '<div class="daynav"><button id="prev">◀</button><div class="dlabel">'+M+'/'+sel+'（'+wd(sel)+'）</div><div>';
  const n = new Date();
  if(!(n.getFullYear()===Y && n.getMonth()+1===M && n.getDate()===sel)) h += '<button class="today" id="todayBtn">今日</button> ';
  h += '<button id="next">▶</button></div></div>';
  // 自分のシフト
  h += '<div class="card my"><h3>あなたのシフト</h3>';
  if(!ik){ h += '<div class="big">休み</div>'; }
  else{
    h += '<div class="big">'+ik.start+' 〜 '+ik.end;
    if(ik.support_h>0 && !ik.store) h += '<span class="badge b-sup">応援'+ik.support_h+'時間</span>';
    if(sel===27) h += '<span class="badge b-chg">シフト変更（休み→出勤）</span>';
    h += '</div><div class="mut">休憩'+ik.break_h+'時間 ・ 稼働'+ik.work_h+'時間'+(ik.store?' ・ 片縄店勤務':' ・ 終日応援（片縄店は不在）')+'</div>';
    const mb = brkText("池田亮介", d);
    if(ik.store && mb) h += '<div style="margin-top:6px">休憩プラン：'+esc(mb)+'</div>';
    if(ik.support_h>0 && ik.store) h += '<div class="mut" style="margin-top:4px">応援'+ik.support_h+'時間を含む日です</div>';
  }
  h += '</div>';
  // 休憩プラン
  if(day.breaks.length){
    h += '<div class="card"><h3>休憩プラン</h3><div class="chips">';
    for(const b of day.breaks) h += '<span class="chip">'+esc(b.name)+' '+b.start+'〜'+b.end+'</span>';
    h += '</div>';
    if(day.nobreak.length) h += '<div class="warn">⚠️ 2人以下で休憩に入れない時間帯：'+day.nobreak.map(z=>z[0]+'〜'+z[1]).join('、')+'</div>';
    h += '</div>';
  }
  // 出勤者全員
  h += '<div class="card"><h3>出勤者全員（'+day.staff.length+'人）</h3><table><tr><th>氏名</th><th>出勤〜退勤</th><th>休憩</th></tr>';
  for(const s of day.staff){
    h += '<tr><td>'+esc(s.name)+(s.support_h>0?' <span class="badge b-sup">応援'+s.support_h+'h</span>':'')+'</td><td>'+s.start+'〜'+s.end+'</td><td>'+(s.break_h>0? esc(brkText(s.name,d) || (s.break_h+'時間')) : '―')+'</td></tr>';
  }
  h += '</table></div>';
  // タイムライン 7:00-22:00
  const T0=7*60, T1=22*60, pc = t => ((t-T0)/(T1-T0)*100);
  const tm = t => { const[a,b]=t.split(":").map(Number); return a*60+b; };
  h += '<div class="card"><h3>タイムライン（勤務＝青、休憩＝黄）</h3><div class="tl"><div class="tlhead">';
  for(let hh=7; hh<=22; hh+=3) h += '<span style="left:'+pc(hh*60)+'%">'+hh+':00</span>';
  h += '</div>';
  for(const s of day.staff){
    h += '<div class="tlrow"><div class="tlname">'+esc(s.name)+'</div><div class="tlbar"><div class="seg" style="left:'+pc(tm(s.start))+'%;width:'+(pc(tm(s.end))-pc(tm(s.start)))+'%"></div>';
    for(const b of brkOf(s.name, d)) h += '<div class="seg brk" style="left:'+pc(tm(b.start))+'%;width:'+(pc(tm(b.end))-pc(tm(b.start)))+'%"></div>';
    h += '</div></div>';
  }
  h += '</div></div>';
  document.getElementById("view-day").innerHTML = h;
  document.getElementById("prev").onclick = ()=>{ if(sel>1){ sel--; renderDay(); } };
  document.getElementById("next").onclick = ()=>{ if(sel<30){ sel++; renderDay(); } };
  const tb = document.getElementById("todayBtn"); if(tb) tb.onclick = ()=>{ const n2=new Date(); if(n2.getFullYear()===Y && n2.getMonth()+1===M){ sel=n2.getDate(); renderDay(); } };
}

function renderCal(){
  let h = '<div class="card"><h3>'+DATA.monthLabel+'｜池田亮介（出勤'+DATA.ikedaTotals.days+'日 ・ 合計'+DATA.ikedaTotals.work_h+'時間）</h3><div class="cal">';
  for(const w of WD) h += '<div class="hd">'+w+'</div>';
  const first = new Date(Y, M-1, 1).getDay();
  for(let i=0;i<first;i++) h += '<div class="cell empty"></div>';
  for(let d=1; d<=30; d++){
    const ik = DATA.days[String(d)].ikeda, g = new Date(Y, M-1, d).getDay();
    const cls = ["cell", ik?"work":"off", (ik && ik.support_h>0 && !ik.store)?"sup":"", d===sel?"sel":"", g===0?"sun":(g===6?"sat":"")].join(" ");
    h += '<div class="'+cls+'" data-d="'+d+'"><div class="dn">'+d+'</div>';
    if(ik) h += '<div class="tm">'+ik.start+'〜</div>'+((ik.support_h>0 && !ik.store)?'<div>応援</div>':'');
    else h += '<div class="tm">休み</div>';
    h += '</div>';
  }
  h += '</div><div class="mut" style="margin-top:8px">日付タップで日別表示へ。紫＝終日応援の日</div></div>';
  document.getElementById("view-cal").innerHTML = h;
  document.querySelectorAll(".cell[data-d]").forEach(c => c.onclick = ()=>{ sel = Number(c.dataset.d); switchTab("day"); });
}

function renderMem(){
  let h = '<div class="card"><h3>メンバー集計（'+DATA.monthLabel+'）</h3><table><tr><th>氏名</th><th>出勤日数</th><th>勤務時間</th><th>応援日数</th></tr>';
  for(const m of DATA.members) h += '<tr><td>'+esc(m.name)+'</td><td>'+m.days+'日</td><td>'+m.work_h+'時間</td><td>'+(m.support_days? m.support_days+'日':'―')+'</td></tr>';
  h += '</table></div>';
  document.getElementById("view-mem").innerHTML = h;
}

function renderRule(){
  let h = '<div class="card"><h3>休憩ルール・メモ</h3><ul class="note">';
  for(const n of DATA.notes) h += '<li>'+esc(n)+'</li>';
  h += '</ul></div>';
  document.getElementById("view-rule").innerHTML = h;
}

function switchTab(t){
  tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab===t));
  for(const v of ["day","cal","mem","rule"]) document.getElementById("view-"+v).hidden = (v!==t);
  if(t==="day") renderDay(); if(t==="cal") renderCal(); if(t==="mem") renderMem(); if(t==="rule") renderRule();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = ()=>switchTab(b.dataset.tab));
renderDay();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
