function eanBits(jan) {
  const d = jan.split("").map(Number);
  if (jan.length === 13) {
    const par = TABLES.P[d[0]];
    let bits = "101";
    for (let k = 1; k <= 6; k++) bits += TABLES[par[k - 1]][d[k]];
    bits += "01010";
    for (let k = 7; k <= 12; k++) bits += TABLES.R[d[k]];
    bits += "101";
    return bits;
  }
  let bits = "101";
  for (let k = 0; k < 4; k++) bits += TABLES.L[d[k]];
  bits += "01010";
  for (let k = 4; k < 8; k++) bits += TABLES.R[d[k]];
  bits += "101";
  return bits;
}
function draw(jan) {
  const cv = document.getElementById("bc"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, bits = eanBits(jan), n = bits.length;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const quiet = 30, mw = (W - quiet * 2) / n;
  ctx.fillStyle = "#000";
  for (let i = 0; i < n; i++) {
    if (bits[i] === "1") {
      const mid = jan.length === 13 ? (i >= 46 && i < 50) : (i >= 33 && i < 38);
      const long = (i < 3 || mid || i >= n - 3) ? 16 : 0;
      ctx.fillRect(quiet + i * mw, 6, Math.ceil(mw), H - 30 + long);
    }
  }
}

function parseCSV(text) {
  const rows = []; let row = [], cur = "", inQ = false;
  text = text.replace(/^\ufeff/, "");
  for (let k = 0; k < text.length; k++) {
    const ch = text[k];
    if (inQ) {
      if (ch === '"') { if (text[k + 1] === '"') { cur += '"'; k++; } else inQ = false; }
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); cur = ""; rows.push(row); row = []; }
    else if (ch !== "\r") cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
