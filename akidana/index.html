<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>空き棚補充アプリ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f3f4f6; color: #111827; }
  header { background: #1f2937; color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
  header .tag { display:inline-block; font-size:11px; background:#059669; color:#fff; border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:middle; font-weight:700; }
  nav { display: flex; background: #374151; position: sticky; top: 57px; z-index: 10; }
  nav button { flex: 1; padding: 12px 2px; font-size: 14px; font-weight: 700; color: #d1d5db; background: none; border: none; border-bottom: 3px solid transparent; }
  nav button.active { color: #fff; border-bottom-color: #059669; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .view { display: none; padding-bottom: 118px; } .view.active { display: block; }
  .btn { display: block; width: 100%; padding: 16px; font-size: 17px; font-weight: 700; border: none; border-radius: 12px; background: #2563eb; color: #fff; margin: 10px 0; }
  .btn:active { opacity: .8; }
  .btn-green { background: #059669; } .btn-gray { background: #4b5563; } .btn-red { background: #dc2626; }
  .btn-small { padding: 10px; font-size: 14px; margin: 6px 0; }
  input[type="text"], input[type="tel"], textarea { width: 100%; padding: 14px; font-size: 17px; border: 2px solid #d1d5db; border-radius: 12px; background: #fff; font-family: inherit; }
  textarea { font-size: 13px; }
  .row { display: flex; gap: 8px; } .row .btn { margin: 0; }
  .hint { font-size: 13px; color: #6b7280; margin: 8px 0; line-height: 1.5; }
  .card { border-radius: 16px; padding: 14px 10px; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.18); margin-top: 12px; }
  .card .cls { font-size: 24px; font-weight: 900; line-height: 1.2; }
  .card .name { font-size: 17px; font-weight: 700; margin-top: 8px; line-height: 1.4; }
  .card .jan { font-size: 14px; opacity: .85; margin-top: 2px; letter-spacing: .05em; }
  .card .pos { font-size: 16px; font-weight: 700; margin-top: 10px; line-height: 1.6; background: rgba(255,255,255,.18); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; }
  .c-ari { background: #2563eb; } .c-nashi { background: #4b5563; } .c-reg { background: #059669; } .c-dup { background: #d97706; } .c-err { background: #dc2626; }
  .bc-card { background: #fff; border-radius: 16px; padding: 16px 8px 10px; margin-top: 10px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  .bc-card canvas { width: 94%; height: auto; display: none; margin: 0 auto; }
  .bc-jan { font-family: ui-monospace, Menlo, monospace; font-size: 29px; font-weight: 800; letter-spacing: .12em; color: #111827; margin-top: 4px; }
  .fixed-btn { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 25; box-shadow: 0 8px 20px rgba(0,0,0,.3); font-size: 20px; padding: 22px; margin: 0; width: auto; display: none; }
  .fixed-btn.show { display: block; }
  .group { font-size: 14px; font-weight: 900; color: #374151; margin: 16px 0 6px; }
  .item { background: #fff; border-radius: 10px; padding: 11px 12px; margin-bottom: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .item .janline { font-family: ui-monospace, Menlo, monospace; font-size: 16px; font-weight: 800; letter-spacing: .04em; }
  .item .memo { font-size: 14px; font-weight: 600; margin-top: 3px; line-height: 1.4; }
  .item .date { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .item .actions { display: flex; gap: 8px; margin-top: 8px; }
  .item .actions button { flex: 1; padding: 9px; font-size: 13px; font-weight: 700; border: none; border-radius: 8px; color: #fff; }
  .hist { background: #fff; border-radius: 10px; padding: 9px 12px; margin-bottom: 5px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .badge { flex: none; min-width: 56px; height: 26px; border-radius: 999px; color: #fff; font-weight: 900; font-size: 12px; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
  .badge-ari { background: #2563eb; } .badge-nashi { background: #4b5563; }
  .hist time { color: #9ca3af; font-size: 11px; margin-left: auto; flex: none; }
  .memo-box { background: #fff; border-radius: 12px; padding: 12px; margin-top: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .memo-box label { font-size: 14px; font-weight: 800; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>空き棚補充アプリ<span class="tag">空き棚</span></h1>
  <div class="sub" id="sub-count">空き棚登録 0件（アプリ内保存）</div>
</header>
<nav>
  <button id="tab-reg" class="active">空き棚登録</button>
  <button id="tab-chk">倉庫で照合</button>
  <button id="tab-list">登録一覧</button>
</nav>
<main>
  <section id="view-reg" class="view active">
    <div class="hint" style="font-size:15px;">空き棚のプライスカードをスキャンすると、このアプリの中に保存されます。</div>
    <div id="reg-result"></div>
    <div class="bc-card">
      <canvas id="reg-bc" width="570" height="240"></canvas>
      <div id="reg-jan" class="bc-jan"></div>
      <div id="reg-bcph" class="hint" style="margin:0;">登録すると、ここにバーコードが出ます。</div>
    </div>
    <div class="memo-box" id="reg-memo-box" style="display:none;">
      <label for="reg-memo">メモ（場所など）</label>
      <input type="text" id="reg-memo" placeholder="例：化粧品の棚、入口の近く">
      <button class="btn btn-green btn-small" id="btn-memo-save">メモを保存</button>
      <div class="hint" id="reg-memo-jan"></div>
    </div>
    <div class="group">手入力で登録</div>
    <div class="row">
      <input type="tel" id="reg-input" inputmode="numeric" placeholder="JANコード（13桁）" maxlength="13">
      <button class="btn btn-green" id="btn-reg-manual" style="width:110px; flex:none;">登録</button>
    </div>
    <button class="btn fixed-btn btn-green show" id="btn-reg-scan" data-fixed-for="reg">空き棚をスキャン（登録）</button>
  </section>
  <section id="view-chk" class="view">
    <div class="hint" style="font-size:15px;">倉庫の商品をスキャンすると、登録した空き棚にその商品が入るかどうかが分かります。</div>
    <div id="chk-result"></div>
    <div class="bc-card">
      <canvas id="chk-bc" width="570" height="240"></canvas>
      <div id="chk-jan" class="bc-jan"></div>
      <div id="chk-bcph" class="hint" style="margin:0;">照合すると、ここにバーコードが出ます。</div>
    </div>
    <div id="chk-delete-box" style="display:none;">
      <button class="btn btn-red" id="btn-chk-delete">補充したので削除</button>
    </div>
    <div class="group">手入力で照合</div>
    <div class="row">
      <input type="tel" id="chk-input" inputmode="numeric" placeholder="JANコード（13桁）" maxlength="13">
      <button class="btn" id="btn-chk-manual" style="width:110px; flex:none;">照合</button>
    </div>
    <div class="group">照合履歴</div>
    <div id="chk-hist"><div class="hint">まだ履歴がありません。</div></div>
    <button class="btn fixed-btn" id="btn-chk-scan" data-fixed-for="chk">倉庫の商品をスキャン（照合）</button>
  </section>
  <section id="view-list" class="view">
    <div id="list-body"></div>
    <div class="group">バックアップ</div>
    <button class="btn btn-gray btn-small" id="btn-export">全件をコピー（書き出し）</button>
    <textarea id="export-box" rows="4" placeholder="書き出し結果がここに出ます" style="display:none;"></textarea>
    <div class="group">復元（貼り付け）</div>
    <textarea id="import-box" rows="4" placeholder="書き出した内容をここに貼り付け"></textarea>
    <button class="btn btn-gray btn-small" id="btn-import">貼り付けて復元（重複は除く）</button>
    <div class="hint" id="import-msg"></div>
    <div class="group">全件削除</div>
    <button class="btn btn-red btn-small" id="btn-delete-all">登録を全件削除</button>
  </section>
</main>
<script>
const TABLES = {"L": ["0001101", "0011001", "0010011", "0111101", "0100011", "0110001", "0101111", "0111011", "0110111", "0001011"], "G": ["0100111", "0110011", "0011011", "0100001", "0011101", "0111001", "0000101", "0010001", "0001001", "0010111"], "R": ["1110010", "1100110", "1101100", "1000010", "1011100", "1001110", "1010000", "1000100", "1001000", "1110100"], "P": ["LLLLLL", "LLGLGG", "LLGGLG", "LLGGGL", "LGLLGG", "LGGLLG", "LGGGLL", "LGLGLG", "LGLGGL", "LGGLGL"]};
const APP_URL = "https://ryosukekun129-ai.github.io/akidana/";
const STORE_KEY = "akidana-items-v1";
const PENDING_KEY = "akidana-pending-mode";
function loadStore() {
  try { const v = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function saveStore(items) { localStorage.setItem(STORE_KEY, JSON.stringify(items)); }
function findItem(jan) { return loadStore().find(x => x.j === jan) || null; }
function fmtDate(ts) {
  const d = new Date(ts);
  return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function updateCount() {
  document.getElementById("sub-count").textContent = "空き棚登録 " + loadStore().length + "件（アプリ内保存）";
}
function validCheckDigit(jan) {
  const d = jan.split("").map(Number);
  if (jan.length === 13) {
    let s = 0; for (let i = 0; i < 12; i++) s += d[i] * (i % 2 === 0 ? 1 : 3);
    return (10 - s % 10) % 10 === d[12];
  }
  if (jan.length === 8) {
    let s = 0; for (let i = 0; i < 7; i++) s += d[i] * (i % 2 === 0 ? 3 : 1);
    return (10 - s % 10) % 10 === d[7];
  }
  return false;
}
function cleanJan(v) { return (v || "").replace(/\D/g, ""); }
function janError(jan) {
  if (!/^\d{8}$/.test(jan) && !/^\d{13}$/.test(jan)) return "JANは8桁または13桁で読み取ってください。";
  if (!validCheckDigit(jan)) return "チェックデジットが合いません。読み取りミスの可能性があります。";
  return null;
}
function ean13(jan) {
  const d = jan.split("").map(Number);
  const par = TABLES.P[d[0]];
  let bits = "101";
  for (let k = 1; k <= 6; k++) bits += TABLES[par[k - 1]][d[k]];
  bits += "01010";
  for (let k = 7; k <= 12; k++) bits += TABLES.R[d[k]];
  bits += "101";
  return bits;
}
function ean8(jan) {
  const d = jan.split("").map(Number);
  let bits = "101";
  for (let k = 0; k < 4; k++) bits += TABLES.L[d[k]];
  bits += "01010";
  for (let k = 4; k < 8; k++) bits += TABLES.R[d[k]];
  bits += "101";
  return bits;
}
function drawBarcode(prefix, jan) {
  const cv = document.getElementById(prefix + "-bc"), ph = document.getElementById(prefix + "-bcph"), jt = document.getElementById(prefix + "-jan");
  let bits = null, guard = null;
  if (/^\d{13}$/.test(jan || "")) { bits = ean13(jan); guard = i => (i < 3 || (i >= 46 && i < 50) || i >= 92); }
  else if (/^\d{8}$/.test(jan || "")) { bits = ean8(jan); guard = i => (i < 3 || (i >= 31 && i < 36) || i >= 64); }
  if (!bits) { cv.style.display = "none"; jt.textContent = ""; ph.style.display = "block"; return; }
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const quiet = 30, mw = (W - quiet * 2) / bits.length;
  ctx.fillStyle = "#000";
  for (let i = 0; i < bits.length; i++) {
    if (bits[i] === "1") ctx.fillRect(quiet + i * mw, 6, Math.ceil(mw), guard(i) ? H - 14 : H - 44);
  }
  cv.style.display = "block"; jt.textContent = jan; ph.style.display = "none";
}
function esc(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const VIEWS = ["reg", "chk", "list"];
function switchView(name) {
  for (const k of VIEWS) {
    document.getElementById("view-" + k).classList.toggle("active", k === name);
    document.getElementById("tab-" + k).classList.toggle("active", k === name);
  }
  document.querySelectorAll(".fixed-btn").forEach(b => b.classList.toggle("show", b.dataset.fixedFor === name));
  if (name === "list") renderList();
}
for (const k of VIEWS) document.getElementById("tab-" + k).addEventListener("click", () => switchView(k));
function launchScan(mode) {
  try { localStorage.setItem(PENDING_KEY, mode); } catch (e) {}
  const ret = APP_URL + "?scan={CODE}";
  location.href = "intent://scan/?ret=" + encodeURIComponent(ret) + "&SCAN_FORMATS=EAN_13,EAN_8" +
    "#Intent;scheme=zxing;package=com.teacapps.barcodescanner;S.browser_fallback_url=" +
    encodeURIComponent(APP_URL) + ";end";
}
document.getElementById("btn-reg-scan").addEventListener("click", () => launchScan("reg"));
document.getElementById("btn-chk-scan").addEventListener("click", () => launchScan("chk"));
let memoTargetJan = null;
function showMemoEditor(jan) {
  const item = findItem(jan);
  memoTargetJan = jan;
  const box = document.getElementById("reg-memo-box");
  box.style.display = "block";
  document.getElementById("reg-memo").value = item ? (item.memo || "") : "";
  document.getElementById("reg-memo-jan").textContent = "対象JAN：" + jan;
}
document.getElementById("btn-memo-save").addEventListener("click", () => {
  if (!memoTargetJan) return;
  const items = loadStore();
  const it = items.find(x => x.j === memoTargetJan);
  if (!it) return;
  it.memo = document.getElementById("reg-memo").value.trim();
  saveStore(items);
  document.getElementById("reg-result").innerHTML = '<div class="card c-reg"><div class="cls">メモを保存しました</div><div class="jan">' + memoTargetJan + '</div><div class="pos">' + esc(it.memo || "（メモなし）") + "</div></div>";
  updateCount();
});
function doRegister(raw) {
  const jan = cleanJan(raw);
  const err = janError(jan);
  const box = document.getElementById("reg-result");
  if (err) {
    box.innerHTML = '<div class="card c-err"><div class="cls">登録できませんでした</div><div class="jan">' + esc(jan) + '</div><div class="pos">' + err + "</div></div>";
    drawBarcode("reg", "");
    document.getElementById("reg-memo-box").style.display = "none";
    return;
  }
  const existing = findItem(jan);
  if (existing) {
    box.innerHTML = '<div class="card c-dup"><div class="cls">登録済みです</div><div class="jan">' + jan + '</div><div class="pos">登録日時：' + fmtDate(existing.at) + (existing.memo ? "\nメモ：" + esc(existing.memo) : "") + "</div></div>";
  } else {
    const items = loadStore();
    items.push({ j: jan, memo: "", at: Date.now() });
    saveStore(items);
    box.innerHTML = '<div class="card c-reg"><div class="cls">空き棚を登録しました</div><div class="jan">' + jan + '</div><div class="pos">このJANはアプリ内に保存されました。下でメモを付けられます。</div></div>';
    if (navigator.vibrate) navigator.vibrate(80);
  }
  drawBarcode("reg", jan);
  showMemoEditor(jan);
  updateCount();
}
let chkTargetJan = null;
let histCount = 0;
function addChkHistory(jan, ari) {
  const box = document.getElementById("chk-hist");
  if (histCount === 0) box.innerHTML = "";
  histCount++;
  const t = new Date();
  const hh = String(t.getHours()).padStart(2, "0"), mm = String(t.getMinutes()).padStart(2, "0");
  const div = document.createElement("div");
  div.className = "hist";
  div.innerHTML = '<span class="badge ' + (ari ? "badge-ari" : "badge-nashi") + '">' + (ari ? "空きあり" : "空きなし") + "</span><span>" + jan + "</span><time>" + hh + ":" + mm + "</time>";
  box.prepend(div);
}
function doCheck(raw) {
  const jan = cleanJan(raw);
  const err = janError(jan);
  const box = document.getElementById("chk-result");
  document.getElementById("chk-delete-box").style.display = "none";
  chkTargetJan = null;
  if (err) {
    box.innerHTML = '<div class="card c-err"><div class="cls">照合できませんでした</div><div class="jan">' + esc(jan) + '</div><div class="pos">' + err + "</div></div>";
    drawBarcode("chk", "");
    return;
  }
  const item = findItem(jan);
  if (item) {
    chkTargetJan = jan;
    box.innerHTML = '<div class="card c-ari"><div class="cls">空きあり</div><div class="name">この商品は入れられます</div><div class="jan">' + jan + '</div><div class="pos">登録日時：' + fmtDate(item.at) + (item.memo ? "\nメモ：" + esc(item.memo) : "") + "</div></div>";
    document.getElementById("chk-delete-box").style.display = "block";
    if (navigator.vibrate) navigator.vibrate(80);
  } else {
    box.innerHTML = '<div class="card c-nashi"><div class="cls">空きなし</div><div class="name">入れる空き棚は登録されていません</div><div class="jan">' + jan + "</div></div>";
  }
  drawBarcode("chk", jan);
  addChkHistory(jan, !!item);
}
document.getElementById("btn-chk-delete").addEventListener("click", () => {
  if (!chkTargetJan) return;
  if (!confirm(chkTargetJan + " を補充済みとして削除しますか？")) return;
  saveStore(loadStore().filter(x => x.j !== chkTargetJan));
  document.getElementById("chk-result").innerHTML = '<div class="card c-nashi"><div class="cls">削除しました</div><div class="jan">' + chkTargetJan + '</div><div class="pos">補充済みとして登録から外しました。</div></div>';
  document.getElementById("chk-delete-box").style.display = "none";
  chkTargetJan = null;
  updateCount();
});
document.getElementById("btn-reg-manual").addEventListener("click", () => {
  const v = document.getElementById("reg-input").value;
  if (cleanJan(v).length >= 8) doRegister(v);
});
document.getElementById("reg-input").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("btn-reg-manual").click(); });
document.getElementById("btn-chk-manual").addEventListener("click", () => {
  const v = document.getElementById("chk-input").value;
  if (cleanJan(v).length >= 8) doCheck(v);
});
document.getElementById("chk-input").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("btn-chk-manual").click(); });
function renderList() {
  const body = document.getElementById("list-body");
  const items = loadStore().slice().sort((a, b) => a.at - b.at);
  if (!items.length) { body.innerHTML = '<div class="hint" style="font-size:15px;">まだ登録がありません。「空き棚登録」タブからスキャンしてください。</div>'; return; }
  body.innerHTML = '<div class="group">登録済みの空き棚（' + items.length + '件）</div>' + items.map(it =>
    '<div class="item"><div class="janline">' + it.j + '</div>' +
    (it.memo ? '<div class="memo">' + esc(it.memo) + "</div>" : "") +
    '<div class="date">' + fmtDate(it.at) + "</div>" +
    '<div class="actions"><button style="background:#059669;" data-edit="' + it.j + '">メモ編集</button><button style="background:#dc2626;" data-del="' + it.j + '">削除</button></div></div>'
  ).join("");
  body.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    if (!confirm(b.dataset.del + " を削除しますか？")) return;
    saveStore(loadStore().filter(x => x.j !== b.dataset.del));
    updateCount(); renderList();
  }));
  body.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => {
    switchView("reg");
    const it = findItem(b.dataset.edit);
    document.getElementById("reg-result").innerHTML = '<div class="card c-reg"><div class="cls">メモ編集</div><div class="jan">' + b.dataset.edit + "</div></div>";
    drawBarcode("reg", b.dataset.edit);
    showMemoEditor(b.dataset.edit);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }));
}
document.getElementById("btn-export").addEventListener("click", async () => {
  const text = JSON.stringify(loadStore(), null, 1);
  const box = document.getElementById("export-box");
  box.style.display = "block"; box.value = text; box.select();
  try { await navigator.clipboard.writeText(text); } catch (e) {}
  document.getElementById("import-msg").textContent = "書き出しました。コピーできていない場合は、上の枠の内容を長押しでコピーしてください。";
});
document.getElementById("btn-import").addEventListener("click", () => {
  const raw = document.getElementById("import-box").value.trim();
  const msg = document.getElementById("import-msg");
  if (!raw) { msg.textContent = "貼り付け内容が空です。"; return; }
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) {}
  const incoming = [];
  if (Array.isArray(parsed)) {
    for (const x of parsed) {
      const jan = cleanJan(x.j || x.jan || "");
      if (!janError(jan)) incoming.push({ j: jan, memo: (x.memo || "").toString(), at: x.at || Date.now() });
    }
  } else {
    for (const line of raw.split(/\r?\n/)) {
      const jan = cleanJan(line.split(/[,\t ]/)[0] || "");
      if (jan && !janError(jan)) incoming.push({ j: jan, memo: "", at: Date.now() });
    }
  }
  const items = loadStore();
  const have = new Set(items.map(x => x.j));
  let added = 0;
  for (const it of incoming) { if (!have.has(it.j)) { items.push(it); have.add(it.j); added++; } }
  saveStore(items); updateCount();
  msg.textContent = "復元しました：" + added + "件を追加（重複 " + (incoming.length - added) + "件は除きました）。";
  if (document.getElementById("view-list").classList.contains("active")) renderList();
});
document.getElementById("btn-delete-all").addEventListener("click", () => {
  if (!loadStore().length) return;
  if (!confirm("登録を全件削除しますか？元に戻せません。")) return;
  saveStore([]); updateCount(); renderList();
  document.getElementById("import-msg").textContent = "全件削除しました。";
});
updateCount();
const __scanQ = new URLSearchParams(location.search).get("scan");
if (__scanQ) {
  let mode = "chk";
  try { mode = localStorage.getItem(PENDING_KEY) || "chk"; localStorage.removeItem(PENDING_KEY); } catch (e) {}
  if (mode === "reg") { switchView("reg"); doRegister(__scanQ); }
  else { switchView("chk"); doCheck(__scanQ); }
  history.replaceState(null, "", location.pathname);
}
if (navigator.wakeLock) { const req = () => navigator.wakeLock.request("screen").catch(() => {}); document.addEventListener("click", req, { once: true }); }
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
