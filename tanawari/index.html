<title>棚割りアプリ</title>
<style>

<body>
<header>
  <h1>棚割りアプリ</h1>
  <div class="sub">判定22件（2026-11-18受領資料）</div>

<nav>
  <button id="tab-scan" class="active">判定スキャン</button>
  <button id="tab-search">入力・検索</button>
  <button id="tab-list">判定一覧</button>
</nav>
<main>
  <section id="view-scan" class="view active">
    <div id="result"><div class="hint" style="font-size:15px;">まだ判定していません。下の「バーコードスキャン」ボタンで読み取ってください。</div></div>
    <div id="shelf-area"></div>
    <div class="bc-card">
      <canvas id="s-bc" width="570" height="240"></canvas>
      <div id="s-jan"></div>
      <div id="s-bcph" class="hint" style="margin:0;">商品を表示すると、ここにバーコードが出ます。</div>
    </div>
    <div class="chips" id="g-buttons"></div>
    <div id="history">
      <h2>スキャン履歴 <span id="nochimei"></span></h2>

    </div>
  </section>
  <section id="view-search" class="view">
    <div class="group" style="margin-top:2px;">JANで判定</div>
    <div class="row">
      <input type="tel" id="jan-input" inputmode="numeric" placeholder="JANコード（13桁）" maxlength="13">
      <button class="btn" id="btn-jan" style="width:110px; flex:none;">判定</button>
    </div>
    <div class="group">商品名で検索</div>
    <input type="text" id="name-input" placeholder="例：ムシューダ、カイロ、ホカロン">
    <div id="name-results" style="margin-top:10px;"></div>
    <div id="result2"></div>
  </section>
  <section id="view-list" class="view">
    <div class="chips">
      <button class="chip active" data-f="3">③ 両方（0）</button>
      <button class="chip" data-f="1">① オンのみ</button>
      <button class="chip" data-f="2">② オフのみ</button>
    </div>
    <div id="list-body"></div>
  </section>
</main>
<script>
const DATA = [{"j": "4562496617309", "n": "SS 強粘着斜めカットスペアテープ（P）90周3巻入", "c": 1, "o": [[1, 4, 2]], "f": null}, {"j": "4562496617378", "n": "SUNSTYLE カーペットスペアテープ（P）90周3巻入", "c": 1, "o": [[1, 4, 4]], "f": null}, {"j": "4562496617385", "n": "SUNSTYLE 強粘着スペアテープ（P）90周3巻入", "c": 1, "o": [[1, 4, 3]], "f": null}, {"j": "4562496617392", "n": "SUNSTYLE フローリング用スペアテープ（P）50周3巻入", "c": 1, "o": [[1, 4, 5]], "f": null}, {"j": "4901987226109", "n": "東洋スーパーワンタッチレンジフードカバーでか 1P", "c": 1, "o": [[1, 1, 2], [2, 1, 2]], "f": null}, {"j": "4901987226116", "n": "スーパー大型レンジフードカバー浅・深兼用型 1P", "c": 1, "o": [[1, 2, 3], [2, 1, 1]], "f": null}, {"j": "4901987227120", "n": "東洋パッと貼るだけ深型用フィルター 60CMX3P", "c": 1, "o": [[1, 2, 1], [2, 2, 2]], "f": null}, {"j": "4901987227823", "n": "東洋取替用60CMに切れてるふんわりフィルター 10P", "c": 1, "o": [[2, 2, 1]], "f": null}, {"j": "4901987230748", "n": "東洋 整流板付専用パッと貼るだけスーパーフィルター 1P", "c": 1, "o": [[1, 2, 2], [2, 2, 3]], "f": null}, {"j": "4901987234975", "n": "東洋パッと貼るだけホコリ取りフィルター 3枚", "c": 1, "o": [[2, 3, 2]], "f": null}, {"j": "4901987254096", "n": "東洋 パッと貼るだけホコリとりフィルター15CM 6枚", "c": 1, "o": [[2, 3, 1]], "f": null}, {"j": "4901987256052", "n": "東洋 そでがのびるレンジパネルでか BE Nベージュ", "c": 1, "o": [[1, 1, 1], [2, 1, 3]], "f": null}, {"j": "4902109220173", "n": "三菱厚っレンジフードフィルターハンドカット取替用 46CM×1.8M", "c": 1, "o": [[2, 2, 4]], "f": null}, {"j": "4903180255177", "n": "トイレバスボンくん抗菌 コンパクトブラシケース付", "c": 1, "o": [[1, 3, 3]], "f": null}, {"j": "4903320168572", "n": "激落ちくんトレループ PRハンディ伸縮 グレー", "c": 1, "o": [[1, 3, 1]], "f": null}, {"j": "4903320168954", "n": "激落ちくんトレループ PRワイパー床・階段用 グレー", "c": 1, "o": [[1, 3, 2]], "f": null}, {"j": "4959244021158", "n": "ALレンジクリーンワイドパネル50×120CM 2枚組", "c": 1, "o": [[1, 3, 4], [2, 4, 1]], "f": null}, {"j": "4959244031287", "n": "ALガスコンロ下敷き55×75CM 2枚組", "c": 1, "o": [[2, 4, 3]], "f": null}, {"j": "4959244094060", "n": "レンジフードフィルターロールタイプ（12）46CM×11M", "c": 1, "o": [[1, 1, 3], [2, 4, 4]], "f": null}, {"j": "4959244094138", "n": "スライド式レンジフードカバー深型用 2枚組", "c": 1, "o": [[1, 3, 5], [2, 4, 2]], "f": null}, {"j": "4959244094381", "n": "レンジフードフィルターミシン目付 3.6M", "c": 1, "o": [[2, 2, 5]], "f": null}, {"j": "4978406025735", "n": "ミラクルSOUJIKOマルチ 45周4P", "c": 1, "o": [[1, 4, 1]], "f": null}];
const P17 = {"grid": [], "items": []};
const TABLES = {"L": ["0001101", "0011001", "0010011", "0111101", "0100011", "0110001", "0101111", "0111011", "0110111", "0001011"], "G": ["0100111", "0110011", "0011011", "0100001", "0011101", "0111001", "0000101", "0010001", "0001001", "0010111"], "R": ["1110010", "1100110", "1101100", "1000010", "1011100", "1001110", "1010000", "1000100", "1001000", "1110100"], "P": ["LLLLLL", "LLGLGG", "LLGGLG", "LLGGGL", "LGLLGG", "LGGLLG", "LGGGLL", "LGLGLG", "LGLGGL", "LGGLGL"]};
const ON_GRIDS = {"1": [3, 3, 5, 5], "2": [3, 5, 2, 4]};
const OFF_GRIDS = {};
const byJan = new Map(DATA.map(d => [d.j, d]));
const posIndex = new Map();
for (const d of DATA) {
  if (d.o) for (const a of d.o) posIndex.set("on:" + a[0] + ":" + a[1] + ":" + a[2], d);
  if (d.f) for (const a of d.f) posIndex.set("off:" + a[0] + ":" + a[1] + ":" + a[2], d);
}
const CLS = {1: "① オンのみ", 2: "② オフのみ", 3: "③ オン・オフ両方", 4: "④ 棚落ち"};
function posHtml(d) {
  let s = [];
  if (d.o) s.push(d.o.map(a => "オン ゴンドラ" + a[0] + " 上から" + a[1] + "段目 左から" + a[2] + "番目").join("<br>"));
  if (d.f) s.push(d.f.map(a => "オフ" + a[0] + " 上から" + a[1] + "段目 左から" + a[2] + "番目").join("<br>"));
  return s.join("<br>");
}
function posText(d) {
  let s = [];
  if (d.o) s.push(d.o.map(a => "ゴンドラ" + a[0] + " " + a[1] + "段目").join("・"));
  if (d.f) s.push(d.f.map(a => "オフ" + a[0] + " " + a[1] + "段目").join("・"));
  return s.join(" ／ ");
}
function judge(jan) {
  jan = (jan || "").replace(/\D/g, "");
  const d = byJan.get(jan);
  if (d) return { jan, cls: d.c, name: d.n, pos: posHtml(d), o: d.o, f: d.f };
  return { jan, cls: 4, name: "資料に無い商品", pos: "棚から外して別処理（棚落ち）" };
}
function shelfHtml(kind, grids, a, color, focus) {
  const grid = grids[a[0]];
  if (!grid) return "";
  const hl = (focus && focus.kind === kind && focus.g === a[0]) ? focus : { t: a[1], p: a[2] };
  const title = (kind === "on" ? "ゴンドラ" + a[0] : "オフ" + a[0]) + " 上から" + a[1] + "段目 左から" + a[2] + "番目";
  let rows = "";
  grid.forEach((cnt, ri) => {
    let cells = "";
    for (let ci = 1; ci <= cnt; ci++) {
      const hit = (ri + 1 === hl.t && ci === hl.p);
      cells += '<span class="scell' + (hit ? " hit" : "") + '" data-t="' + (ri + 1) + '" data-p="' + ci + '"' + (hit ? ' style="background:' + color + '"' : "") + "></span>";
    }
    rows += '<div class="srow"><span class="slab">' + (ri + 1) + "段</span>" + cells + "</div>";
  });
  return '<div class="shelf" data-kind="' + kind + '" data-g="' + a[0] + '" data-ct="' + a[1] + '" data-cp="' + a[2] + '"><div class="stitle">' + (kind === "on" ? "オンの棚：" : "オフの棚：") + title + "</div>" + rows + "</div>";
}
function showResult(el, r, focus) {
  if (!focus) {
    if (r.o) focus = { kind: "on", g: r.o[0][0], t: r.o[0][1], p: r.o[0][2] };
    else if (r.f) focus = { kind: "off", g: r.f[0][0], t: r.f[0][1], p: r.f[0][2] };
  }
  let shelves = "";
  const color = { 1: "#2563eb", 2: "#059669", 3: "#d97706" }[r.cls] || "#6b7280";
  if (r.o) for (const a of r.o) shelves += shelfHtml("on", ON_GRIDS, a, color, focus);
  if (r.f) for (const a of r.f) shelves += shelfHtml("off", OFF_GRIDS, a, color, focus);
  el.innerHTML = '<div class="card c' + r.cls + '"><div class="cls">' + CLS[r.cls] + '</div>' +
    '<div class="name">' + r.name + '</div><div class="jan">' + r.jan + '</div>' +
    '<div class="pos">' + r.pos + '</div>' + shelves + '</div>';
  bindShelfNav(el, focus);
}
let suppressTapUntil = 0;
function navigate(el, kind, g, t, p) {
  const d = posIndex.get(kind + ":" + g + ":" + t + ":" + p);
  if (d) showResult(el, judge(d.j), { kind, g, t, p });
  else showEmpty(el, kind, g, t, p);
}
function showEmpty(el, kind, g, t, p) {
  const grids = kind === "on" ? ON_GRIDS : OFF_GRIDS;
  const label = kind === "on" ? "オン ゴンドラ" + g : "オフ" + g;
  const shelf = shelfHtml(kind, grids, [g, t, p], "#9ca3af", { kind, g, t, p });
  el.innerHTML = '<div class="card empty"><div class="cls">商品なし</div>' +
    '<div class="name">この位置に商品は置かれていません</div>' +
    '<div class="pos">' + label + " 上から" + t + "段目 左から" + p + "番目</div>" + shelf + '</div>';
  bindShelfNav(el, { kind, g, t, p });
}
function bindShelfNav(el, focus) {
  el._focus = focus;
  el.querySelectorAll(".shelf").forEach(sh => {
    const kind = sh.dataset.kind, g = +sh.dataset.g;
    const grids = kind === "on" ? ON_GRIDS : OFF_GRIDS;
    sh.querySelectorAll(".scell").forEach(cell => {
      cell.addEventListener("click", () => {
        if (Date.now() < suppressTapUntil) return;
        navigate(el, kind, g, +cell.dataset.t, +cell.dataset.p);
      });
    });
    let tx = null;
    sh.addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; }, { passive: true });
    sh.addEventListener("touchend", e => {
      if (tx === null) return;
      const dx = e.changedTouches[0].clientX - tx; tx = null;
      if (Math.abs(dx) < 40) return;
      suppressTapUntil = Date.now() + 400;
      const f = el._focus;
      let ct, cp;
      if (f && f.kind === kind && f.g === g) { ct = f.t; cp = f.p; }
      else { ct = +sh.dataset.ct; cp = +sh.dataset.cp; }
      const grid = grids[g];
      if (!grid) return;
      const cnt = grid[ct - 1];
      if (!cnt) return;
      const np = Math.min(cnt, Math.max(1, cp + (dx > 0 ? -1 : 1)));
      if (np !== cp) navigate(el, kind, g, ct, np);
    }, { passive: true });
  });
}
const histList = document.getElementById("hist-list");
let histCount = 0, ochiCount = 0;
function addHistory(r) {
  if (histCount === 0) histList.innerHTML = "";
  histCount++;
  if (r.cls === 4) { ochiCount++; document.getElementById("nochimei").textContent = "／ 棚落ち " + ochiCount + "件"; }
  const t = new Date();
  const hh = String(t.getHours()).padStart(2, "0"), mm = String(t.getMinutes()).padStart(2, "0");
  const div = document.createElement("div");
  div.className = "hist";
  div.innerHTML = '<span class="badge c' + r.cls + '">' + r.cls + '</span><span>' + r.name + '</span><time>' + hh + ":" + mm + "</time>";
  histList.prepend(div);
}
const VIEWS = ["scan", "search", "list"];
function switchView(name) {
  for (const k of VIEWS) {

for (const k of VIEWS) document.getElementById("tab-" + k).addEventListener("click", () => switchView(k));

    encodeURIComponent("https://ryosukekun129-ai.github.io/tanawari/") + ";end";
});
const __scanQ = new URLSearchParams(location.search).get("scan");
document.getElementById("btn-jan").addEventListener("click", () => {
  const v = document.getElementById("jan-input").value;
  if (v.replace(/\D/g, "").length >= 8) showResult(document.getElementById("result2"), judge(v));

document.getElementById("jan-input").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("btn-jan").click(); });
function itemHtml(d) {
  return '<div class="item" data-jan="' + d.j + '"><span class="badge c' + d.c + '">' + d.c + '</span><span><span class="nm">' + d.n + '</span><br><span class="ps">' + posText(d) + " ／ " + d.j + "</span></span></div>";

function bindItems(box, target) {
  box.querySelectorAll(".item").forEach(el => el.addEventListener("click", () => {

  const q = e.target.value.trim();

  const hits = DATA.filter(d => d.n.includes(q)).slice(0, 50);

  bindItems(box, "result2");
});
function renderList(f) {
  const body = document.getElementById("list-body");

  const sorted = items.slice().sort((a, b) => {

    return ka[0] - kb[0] || ka[1] - kb[1] || ka[2] - kb[2];
  });
  for (const d of sorted) {
    const g = f === 2 ? "オフ" + d.f[0][0] : "ゴンドラ" + d.o[0][0];
    if (g !== group) { group = g; html += '<div class="group">' + g + "</div>"; }
    html += itemHtml(d);
  }
  body.innerHTML = html;
  body.querySelectorAll(".item").forEach(el => el.addEventListener("click", () => {
    showResult(document.getElementById("result2"), judge(el.dataset.jan));
    switchView("search");
  }));
}
document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  ch.classList.add("active");
  renderList(+ch.dataset.f);
}));
renderList(3);
/* ===== 判定スキャン：模式図・バーコード・ゴンドラ選択 ===== */
function ean13(jan) {
  const d = jan.split("").map(Number);
  const par = TABLES.P[d[0]];
  let bits = "101";
  for (let k = 1; k <= 6; k++) bits += TABLES[par[k - 1]][d[k]];
  bits += "01010";
  for (let k = 7; k <= 12; k++) bits += TABLES.R[d[k]];
  bits += "101";
  return bits;
}
function ean8(jan) {
  const d = jan.split("").map(Number);
  let bits = "101";
  for (let k = 0; k < 4; k++) bits += TABLES.L[d[k]];
  bits += "01010";
  for (let k = 4; k < 8; k++) bits += TABLES.R[d[k]];
  bits += "101";
  return bits;
}
function drawBarcode(jan) {
  const cv = document.getElementById("s-bc"), ph = document.getElementById("s-bcph"), jt = document.getElementById("s-jan");
  let bits = null, guard = null;
  if (/^\d{13}$/.test(jan || "")) { bits = ean13(jan); guard = i => (i < 3 || (i >= 46 && i < 50) || i >= 92); }
  else if (/^\d{8}$/.test(jan || "")) { bits = ean8(jan); guard = i => (i < 3 || (i >= 31 && i < 36) || i >= 64); }
  if (!bits) { cv.style.display = "none"; jt.textContent = ""; ph.style.display = "block"; return; }
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const quiet = 30, mw = (W - quiet * 2) / bits.length;
  ctx.fillStyle = "#000";
  for (let i = 0; i < bits.length; i++) {
    if (bits[i] === "1") ctx.fillRect(quiet + i * mw, 6, Math.ceil(mw), guard(i) ? H - 14 : H - 44);
  }
  cv.style.display = "block"; jt.textContent = jan; ph.style.display = "none";
}
const p17Index = new Map();
for (const it of P17.items) p17Index.set(it.t + ":" + it.p, it);
const SHELVES = [{"kind": "on", "g": 1, "label": "ゴンドラ1"}, {"kind": "on", "g": 2, "label": "ゴンドラ2"}];
let scanShelf = { kind: "on", g: 1 };
let scanNav = null;
let scanJan = null;
function shelfGridHtml(kind, g, hl) {
  const grids = kind === "on" ? ON_GRIDS : kind === "off" ? OFF_GRIDS : { 0: P17.grid };
  const grid = grids[g];
  if (!grid) return "";
  const label = kind === "on" ? "オンの棚：ゴンドラ" + g : kind === "off" ? "オフの棚：オフ" + g : "資料p17の棚";
  let rows = "";
  grid.forEach((cnt, ri) => {
    let cells = "";
    for (let ci = 1; ci <= cnt; ci++) {
      const hit = hl && hl.t === ri + 1 && hl.p === ci;
      cells += '<span class="scell' + (hit ? " hit" : "") + '" data-t="' + (ri + 1) + '" data-p="' + ci + '"' + (hit ? ' style="background:#374151"' : "") + "></span>";
    }
    rows += '<div class="srow"><span class="slab">' + (ri + 1) + "段</span>" + cells + "</div>";
  });
  return '<div class="shelf" data-kind="' + kind + '" data-g="' + g + '"><div class="stitle">' + label + "</div>" + rows + "</div>";
}
function renderScanShelf() {
  const area = document.getElementById("shelf-area");
  const hl = (scanNav && scanNav.kind === scanShelf.kind && scanNav.g === scanShelf.g) ? scanNav : null;
  area.innerHTML = shelfGridHtml(scanShelf.kind, scanShelf.g, hl);
  const sh = area.querySelector(".shelf");
  if (sh) sh.querySelectorAll(".scell").forEach(cell => cell.addEventListener("click", () => {
    if (Date.now() < suppressTapUntil) return;
    scanGoto(scanShelf.kind, scanShelf.g, +cell.dataset.t, +cell.dataset.p);
  }));
  document.querySelectorAll("#g-buttons .chip").forEach(ch => {
    ch.classList.toggle("active", ch.dataset.kind === scanShelf.kind && +ch.dataset.g === scanShelf.g);
  });
}
function renderGButtons() {
  const box = document.getElementById("g-buttons");
  box.innerHTML = SHELVES.map(s => '<button class="chip" data-kind="' + s.kind + '" data-g="' + s.g + '">' + s.label + "</button>").join("");
  box.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
    scanShelf = { kind: ch.dataset.kind, g: +ch.dataset.g };
    scanNav = null;
    if (scanJan) {
      const d = byJan.get(scanJan);
      if (d) {
        const arr = scanShelf.kind === "on" ? d.o : scanShelf.kind === "off" ? d.f : null;
        if (arr) for (const a of arr) { if (a[0] === scanShelf.g) { scanNav = { kind: scanShelf.kind, g: scanShelf.g, t: a[1], p: a[2] }; break; } }
      }
    }
    renderScanShelf();
  }));
}
function scanCardHtml(r) {
  return '<div class="card c' + r.cls + '"><div class="cls">' + CLS[r.cls] + '</div>' +
    '<div class="name">' + r.name + '</div><div class="jan">' + r.jan + '</div>' +
    '<div class="pos">' + r.pos + "</div></div>";
}
function showScanResult(r) {
  scanJan = r.jan;
  if (r.o) { scanShelf = { kind: "on", g: r.o[0][0] }; scanNav = { kind: "on", g: r.o[0][0], t: r.o[0][1], p: r.o[0][2] }; }
  else if (r.f) { scanShelf = { kind: "off", g: r.f[0][0] }; scanNav = { kind: "off", g: r.f[0][0], t: r.f[0][1], p: r.f[0][2] }; }
  else scanNav = null;
  document.getElementById("result").innerHTML = scanCardHtml(r);
  drawBarcode(r.jan);
  renderScanShelf();
}
function scanGoto(kind, g, t, p) {
  scanShelf = { kind, g };
  scanNav = { kind, g, t, p };
  const resEl = document.getElementById("result");
  if (kind === "p17") {
    const it = p17Index.get(t + ":" + p);
    scanJan = it ? it.j : null;
    resEl.innerHTML = '<div class="card p17"><div class="cls">資料p17</div>' +
      '<div class="name">' + (it && it.n ? it.n : "（商品名なし）") + '</div><div class="jan">' + (it ? it.j : "") + "</div>" +
      '<div class="pos">資料p17 上から' + t + "段目 左から" + p + "番目</div></div>";
    drawBarcode(it ? it.j : "");
  } else {
    const d = posIndex.get(kind + ":" + g + ":" + t + ":" + p);
    if (d) {
      scanJan = d.j;
      resEl.innerHTML = scanCardHtml(judge(d.j));
      drawBarcode(d.j);
    } else {
      scanJan = null;
      const label = kind === "on" ? "オン ゴンドラ" + g : "オフ" + g;
      resEl.innerHTML = '<div class="card empty"><div class="cls">商品なし</div>' +
        '<div class="name">この位置に商品は置かれていません</div>' +
        '<div class="pos">' + label + " 上から" + t + "段目 左から" + p + "番目</div></div>";
      drawBarcode("");
    }
  }
  renderScanShelf();
}
/* 画面全体の左右スワイプで隣の商品へ（判定スキャンタブ） */
(function () {
  const view = document.getElementById("view-scan");
  let sx = null, sy = null;
  view.addEventListener("touchstart", e => {
    if (e.target.closest && e.target.closest("button, input")) { sx = null; return; }
    sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY;
  }, { passive: true });
  view.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (!scanNav) return;
    suppressTapUntil = Date.now() + 400;
    const grids = scanNav.kind === "on" ? ON_GRIDS : scanNav.kind === "off" ? OFF_GRIDS : { 0: P17.grid };
    const grid = grids[scanNav.g];
    if (!grid) return;
    const cnt = grid[scanNav.t - 1];
    if (!cnt) return;
    const np = Math.min(cnt, Math.max(1, scanNav.p + (dx > 0 ? -1 : 1)));
    if (np !== scanNav.p) scanGoto(scanNav.kind, scanNav.g, scanNav.t, np);
  }, { passive: true });
})();
renderGButtons();
renderScanShelf();
if (__scanQ) {
  const r = judge(__scanQ);
  showScanResult(r);
  addHistory(r);
  if (navigator.vibrate) navigator.vibrate(80);
  history.replaceState(null, "", location.pathname);
}
if (navigator.wakeLock) { const req = () => navigator.wakeLock.request("screen").catch(() => {}); document.addEventListener("click", req, { once: true }); }
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
