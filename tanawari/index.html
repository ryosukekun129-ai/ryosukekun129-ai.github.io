</main>

const byJan = new Map(DATA.map(d => [d.j, d]));
const CLS = {1: "① オンのみ", 2: "② オフのみ", 3: "③ オン・オフ両方", 4: "④ 棚落ち"};
function onPos(o) { return o.map(a => "オン 資料p" + a[0] + " 上から" + a[1] + "段目・" + a[2] + "番目").join("<br>"); }
function offPos(f) { return f.map(a => "オフ " + a[0] + "台目 上から" + a[1] + "段目・" + a[2] + "番目").join("<br>"); }
function posHtml(d) {
  let s = [];
  if (d.o) s.push(onPos(d.o));
  if (d.f) s.push(offPos(d.f));
  return s.join("<br>");
}
function judge(jan) {
  jan = (jan || "").replace(/\D/g, "");
  const d = byJan.get(jan);
  if (d) return { jan, cls: d.c, name: d.n, pos: posHtml(d) };
  return { jan, cls: 4, name: "資料に無い商品", pos: "棚から外して別処理（棚落ち）" };
}
function showResult(el, r) {
  el.innerHTML = '<div class="card c' + r.cls + '"><div class="cls">' + CLS[r.cls] + '</div>' +
    '<div class="name">' + r.name + '</div><div class="jan">' + r.jan + '</div>' +
    '<div class="pos">' + r.pos + '</div></div>';
}
const histList = document.getElementById("hist-list");
let histCount = 0, ochiCount = 0;
function addHistory(r) {
  if (histCount === 0) histList.innerHTML = "";
  histCount++;
  if (r.cls === 4) { ochiCount++; document.getElementById("nochimei").textContent = "／ 棚落ち " + ochiCount + "件"; }
  const t = new Date();
  const hh = String(t.getHours()).padStart(2, "0"), mm = String(t.getMinutes()).padStart(2, "0");
  const div = document.createElement("div");
  div.className = "hist";
  div.innerHTML = '<span class="badge c' + r.cls + '">' + r.cls + '</span><span>' + r.name + '</span><time>' + hh + ":" + mm + "</time>";
  histList.prepend(div);
}
// tabs
const tabs = { scan: 0, search: 1, list: 2 };
function switchView(name) {
  for (const k of Object.keys(tabs)) {
    document.getElementById("view-" + k).classList.toggle("active", k === name);
    document.getElementById("tab-" + k).classList.toggle("active", k === name);
  }
  if (name !== "scan") stopScan();
}
for (const k of Object.keys(tabs)) document.getElementById("tab-" + k).addEventListener("click", () => switchView(k));
// scan
let stream = null, scanning = false, lastJan = "", lastTime = 0;
const video = document.getElementById("video");
async function startScan() {
  const hint = document.getElementById("scan-hint");
  if (!("BarcodeDetector" in window)) {
    hint.textContent = "このブラウザはバーコード読み取りに対応していません。AndroidのChromeで開くか、「入力・検索」タブでJANを入力してください。";
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = stream;
    await video.play();
    scanning = true;
    document.getElementById("btn-scan").textContent = "スキャン停止";
    const detector = new BarcodeDetector({ formats: ["ean_13", "ean_8"] });
    const loop = async () => {
      if (!scanning) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length) {
          const jan = codes[0].rawValue.replace(/\D/g, "");
          const now = Date.now();
          if (!(jan === lastJan && now - lastTime < 3000)) {
            lastJan = jan; lastTime = now;
            const r = judge(jan);
            showResult(document.getElementById("result"), r);
            addHistory(r);
            if (navigator.vibrate) navigator.vibrate(80);
          }
        }
      } catch (e) {}
      setTimeout(loop, 250);
    };
    loop();
  } catch (e) {
    hint.textContent = "カメラを起動できませんでした。カメラの許可を確認してください。";
  }
}
function stopScan() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById("btn-scan").textContent = "カメラでスキャン開始";
}
document.getElementById("btn-scan").addEventListener("click", () => { scanning ? stopScan() : startScan(); });
// manual
document.getElementById("btn-jan").addEventListener("click", () => {
  const v = document.getElementById("jan-input").value;
  if (v.replace(/\D/g, "").length >= 8) showResult(document.getElementById("result2"), judge(v));
});
document.getElementById("jan-input").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("btn-jan").click(); });
document.getElementById("name-input").addEventListener("input", e => {
  const q = e.target.value.trim();
  const box = document.getElementById("name-results");
  if (!q) { box.innerHTML = ""; return; }
  const hits = DATA.filter(d => d.n.includes(q)).slice(0, 50);
  box.innerHTML = hits.length ? hits.map(d => itemHtml(d)).join("") : '<div class="hint">見つかりませんでした。資料に無い商品は④棚落ちです。</div>';
  bindItems(box);
});
function itemHtml(d) {
  return '<div class="item" data-jan="' + d.j + '"><span class="badge c' + d.c + '">' + d.c + '</span><span><span class="nm">' + d.n + '</span><br><span class="ps">' + posText(d) + " ／ " + d.j + "</span></span></div>";
}
function posText(d) {
  let s = [];
  if (d.o) s.push(d.o.map(a => "オンp" + a[0] + " " + a[1] + "段目").join("・"));
  if (d.f) s.push(d.f.map(a => "オフ" + a[0] + "台目 " + a[1] + "段目").join("・"));
  return s.join(" ／ ");
}
function bindItems(box) {
  box.querySelectorAll(".item").forEach(el => el.addEventListener("click", () => {
    const r = judge(el.dataset.jan);
    showResult(document.getElementById("result2"), r);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }));
}
// list
function renderList(f) {
  const body = document.getElementById("list-body");
  const items = DATA.filter(d => d.c === f);
  let html = "", group = "";
  const sorted = items.slice().sort((a, b) => {
    const ka = f === 2 ? a.f[0] : a.o[0], kb = f === 2 ? b.f[0] : b.o[0];
    return ka[0] - kb[0] || ka[1] - kb[1] || ka[2] - kb[2];
  });
  for (const d of sorted) {
    const g = f === 2 ? "オフ" + d.f[0][0] + "台目" : "オン 資料p" + d.o[0][0];
    if (g !== group) { group = g; html += '<div class="group">' + g + "</div>"; }
    html += itemHtml(d);
  }
  body.innerHTML = html;
  bindItems(body);
  body.querySelectorAll(".item").forEach(el => el.addEventListener("click", () => {
    showResult(document.getElementById("result2"), judge(el.dataset.jan));
    switchView("search");
  }));
}
document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  ch.classList.add("active");
  renderList(+ch.dataset.f);
}));
renderList(3);
