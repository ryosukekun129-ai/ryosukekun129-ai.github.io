<style>

  nav button.active { color: #fff; border-bottom-color: #f59e0b; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .view { display: none; } .view.active { display: block; }
  video { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 4/3; object-fit: cover; }
  .btn { display: block; width: 100%; padding: 16px; font-size: 17px; font-weight: 700; border: none; border-radius: 12px; background: #2563eb; color: #fff; margin: 10px 0; }
  .btn:active { opacity: .8; }
  input[type="text"], input[type="tel"] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid #d1d5db; border-radius: 12px; background: #fff; }
  .row { display: flex; gap: 8px; } .row .btn { margin: 0; }
  .hint { font-size: 13px; color: #6b7280; margin: 8px 0; line-height: 1.5; }
  #result, #result2 { margin-top: 12px; }
  .card { border-radius: 16px; padding: 18px 16px; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .card .cls { font-size: 30px; font-weight: 900; line-height: 1.2; }
  .card .name { font-size: 19px; font-weight: 700; margin-top: 8px; line-height: 1.4; }
  .card .jan { font-size: 14px; opacity: .85; margin-top: 2px; letter-spacing: .05em; }
  .card .pos { font-size: 17px; font-weight: 700; margin-top: 10px; line-height: 1.6; background: rgba(255,255,255,.18); border-radius: 10px; padding: 8px 10px; }
  .shelf { background: #fff; color: #111827; border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .shelf .stitle { font-weight: 800; font-size: 15px; margin-bottom: 8px; }
  .srow { display: flex; align-items: center; gap: 3px; margin-bottom: 3px; }
  .srow .slab { width: 28px; flex: none; font-size: 10px; color: #6b7280; text-align: right; padding-right: 3px; }
  .scell { flex: 1; height: 15px; background: #e5e7eb; border-radius: 3px; }
  .scell.hit { outline: 2px solid #111827; outline-offset: -1px; }
  .c1 { background: #2563eb; } .c2 { background: #059669; } .c3 { background: #d97706; } .c4 { background: #dc2626; }
  .chips { display: flex; gap: 8px; margin: 4px 0 10px; flex-wrap: wrap; }
  .chip { padding: 9px 14px; border-radius: 999px; border: 2px solid #d1d5db; background: #fff; font-size: 14px; font-weight: 700; }
  .chip.active { background: #1f2937; color: #fff; border-color: #1f2937; }
  .group { font-size: 14px; font-weight: 900; color: #374151; margin: 16px 0 6px; }
  .item { background: #fff; border-radius: 10px; padding: 11px 12px; margin-bottom: 6px; display: flex; gap: 10px; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .item:active { background: #eef2ff; }
  .badge { flex: none; width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .item .nm { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .item .ps { font-size: 12px; color: #6b7280; margin-top: 1px; }
  #history { margin-top: 18px; }
  #history h2 { font-size: 15px; margin: 0 0 8px; }
  .hist { background: #fff; border-radius: 10px; padding: 9px 12px; margin-bottom: 5px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .hist .badge { width: 26px; height: 26px; font-size: 13px; }
  .hist time { color: #9ca3af; font-size: 11px; margin-left: auto; flex: none; }
  #nochimei { font-size: 14px; font-weight: 700; color: #dc2626; }
  #view-scan.active { display: flex; flex-direction: column; min-height: calc(100dvh - 132px); }
  .scan-bottom { margin-top: auto; padding-top: 18px; }
  #btn-ext { background: #059669; font-size: 21px; padding: 24px; margin: 0; }

  #p-pos .p-nm { font-size: 16px; font-weight: 700; color: #111827; }
  #p-cnt { margin-left: auto; font-weight: 800; color: #b45309; }

  #p-bc { width: 94%; height: auto; display: block; margin: 0 auto; }
  #p-jan { font-family: ui-monospace, Menlo, monospace; font-size: 29px; font-weight: 800; letter-spacing: .12em; color: #111827; margin-top: 6px; }

  .p-nbtn:active { opacity: .75; }
  .p-subrow { display: flex; gap: 10px; margin-top: 10px; }
  .p-sbtn { flex: 1; padding: 13px 0; font-size: 15px; font-weight: 700; border: 2px solid #9ca3af; border-radius: 12px; background: #fff; color: #374151; }

<body>
<header>
  <h1>棚割りアプリ</h1>
  <div class="sub">2026年11月棚割り／ 判定299件・プライス203件</div>
</header>
<nav>
  <button id="tab-scan" class="active">判定スキャン</button>
  <button id="tab-search">入力・検索</button>
  <button id="tab-list">判定一覧</button>
  <button id="tab-price">プライス変更</button>
</nav>
<main>
  <section id="view-scan" class="view active">
    <div id="result"><div class="hint" style="font-size:15px;">まだ判定していません。下の「バーコードスキャン」ボタンで読み取ってください。</div></div>
    <div id="history">
      <h2>スキャン履歴 <span id="nochimei"></span></h2>
      <div id="hist-list"><div class="hint">まだ履歴がありません。</div></div>
    </div>
    <div class="scan-bottom">
      <button class="btn" id="btn-ext">バーコードスキャン</button>
      <div class="hint">TeaCapps「QRコード＆バーコードリーダー」が開きます。読み取ると自動でこのアプリに戻り、結果が一番上に表示されます。</div>
    </div>
  </section>
  <section id="view-search" class="view">
    <div class="group" style="margin-top:2px;">JANで判定</div>
    <div class="row">
      <input type="tel" id="jan-input" inputmode="numeric" placeholder="JANコード（13桁）" maxlength="13">
      <button class="btn" id="btn-jan" style="width:110px; flex:none;">判定</button>
    </div>
    <div class="group">商品名で検索</div>
    <input type="text" id="name-input" placeholder="例：ムシューダ、カイロ、ホカロン">
    <div id="name-results" style="margin-top:10px;"></div>
    <div id="result2"></div>
  </section>
  <section id="view-list" class="view">
    <div class="chips">
      <button class="chip active" data-f="3">③ 両方（20）</button>
      <button class="chip" data-f="1">① オンのみ</button>
      <button class="chip" data-f="2">② オフのみ</button>
    </div>
    <div id="list-body"></div>
  </section>
  <section id="view-price" class="view">
    <div class="chips" id="p-groups"></div>
    <div id="p-pos"><span id="p-posline"></span><span class="p-nm" id="p-name"></span><span id="p-cnt"></span></div>
    <div id="p-card">
      <canvas id="p-bc" width="570" height="240"></canvas>
      <div id="p-jan"></div>
      <div id="p-doneflag"></div>
    </div>
    <div class="hint">カードを左右にスワイプしても移動できます。電子プライス変更の読み取り用バーコードです。</div>
    <div class="p-navrow">
      <button class="p-nbtn" id="p-prev">＜ 前へ</button>
      <button class="p-nbtn next" id="p-next">次へ ＞</button>
    </div>
    <div class="p-subrow">
      <button class="p-sbtn" id="p-donebtn">✓ 変更済みにする</button>
      <button class="p-sbtn" id="p-tocbtn">目次（<span id="p-donecnt"></span>）</button>
    </div>
  </section>
</main>

    "#Intent;scheme=zxing;package=com.teacapps.barcodescanner;S.browser_fallback_url=" +
    encodeURIComponent("https://ryosukekun129-ai.github.io/tanawari/") + ";end";
});
(function () {
  const q = new URLSearchParams(location.search).get("scan");
  if (q) {
    const r = judge(q);
    showResult(document.getElementById("result"), r);
    addHistory(r);
    if (navigator.vibrate) navigator.vibrate(80);
    history.replaceState(null, "", location.pathname);
  }
})();
document.getElementById("btn-jan").addEventListener("click", () => {
  const v = document.getElementById("jan-input").value;
  if (v.replace(/\D/g, "").length >= 8) showResult(document.getElementById("result2"), judge(v));
});
document.getElementById("jan-input").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("btn-jan").click(); });
function itemHtml(d) {
  return '<div class="item" data-jan="' + d.j + '"><span class="badge c' + d.c + '">' + d.c + '</span><span><span class="nm">' + d.n + '</span><br><span class="ps">' + posText(d) + " ／ " + d.j + "</span></span></div>";
}
function bindItems(box, target) {
  box.querySelectorAll(".item").forEach(el => el.addEventListener("click", () => {
    showResult(document.getElementById(target), judge(el.dataset.jan));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }));
}
document.getElementById("name-input").addEventListener("input", e => {
  const q = e.target.value.trim();
  const box = document.getElementById("name-results");
  if (!q) { box.innerHTML = ""; return; }
  const hits = DATA.filter(d => d.n.includes(q)).slice(0, 50);
  box.innerHTML = hits.length ? hits.map(d => itemHtml(d)).join("") : '<div class="hint">見つかりませんでした。資料に無い商品は④棚落ちです。</div>';
  bindItems(box, "result2");
});
function renderList(f) {
  const body = document.getElementById("list-body");
  const items = DATA.filter(d => d.c === f);
  let html = "", group = "";
  const sorted = items.slice().sort((a, b) => {
    const ka = f === 2 ? a.f[0] : a.o[0], kb = f === 2 ? b.f[0] : b.o[0];
    return ka[0] - kb[0] || ka[1] - kb[1] || ka[2] - kb[2];
  });
  for (const d of sorted) {
    const g = f === 2 ? "オフ" + d.f[0][0] : "ゴンドラ" + d.o[0][0];
    if (g !== group) { group = g; html += '<div class="group">' + g + "</div>"; }
    html += itemHtml(d);
  }
  body.innerHTML = html;
  body.querySelectorAll(".item").forEach(el => el.addEventListener("click", () => {
    showResult(document.getElementById("result2"), judge(el.dataset.jan));
    switchView("search");
  }));
}
document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  ch.classList.add("active");
  renderList(+ch.dataset.f);
}));
renderList(3);
/* ===== プライス変更（スライド） ===== */
const PVER = "2026-11-05-p11-17";
const PLSK = "eprice-state-" + PVER;
let pstate = { i: 0, done: {} };
try { const s = JSON.parse(localStorage.getItem(PLSK)); if (s && s.i < PRICE.length) pstate = s; } catch (e) {}
let pidx = pstate.i || 0;
const pdone = pstate.done || {};
const GORDER = [1, 2, 3, 4, 5, 6, 0];
const PGROUPS = GORDER.filter(g => PRICE.some(x => x.g === g));
function gLabel(g) { return g === 0 ? "資料p17" : "ゴンドラ" + g; }
let pgroup = PRICE[pidx].g;
let viewList = [];
function rebuildView() { viewList = []; PRICE.forEach((it, i) => { if (it.g === pgroup) viewList.push(i); }); }
rebuildView();
function psave() { try { localStorage.setItem(PLSK, JSON.stringify({ i: pidx, done: pdone })); } catch (e) {} }
function ean13(jan) {
  const d = jan.split("").map(Number);
  const par = TABLES.P[d[0]];
  let bits = "101";
  for (let k = 1; k <= 6; k++) bits += TABLES[par[k - 1]][d[k]];
  bits += "01010";
  for (let k = 7; k <= 12; k++) bits += TABLES.R[d[k]];
  bits += "101";
  return bits;
}
function pdraw(jan) {
  const cv = document.getElementById("p-bc"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, bits = ean13(jan);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const quiet = 30, mw = (W - quiet * 2) / 95;
  ctx.fillStyle = "#000";
  for (let i = 0; i < 95; i++) {
    if (bits[i] === "1") {
      const guard = (i < 3 || (i >= 46 && i < 50) || i >= 92);
      ctx.fillRect(quiet + i * mw, 6, Math.ceil(mw), guard ? H - 14 : H - 44);
    }
  }
}
function renderGroups() {
  const box = document.getElementById("p-groups");
  box.innerHTML = PGROUPS.map(g => '<button class="chip' + (g === pgroup ? " active" : "") + '" data-g="' + g + '">' + gLabel(g) + "</button>").join("");
  box.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
    pgroup = +ch.dataset.g; rebuildView(); pidx = viewList[0]; prender();
  }));
}
function prender() {
  const it = PRICE[pidx];
  renderGroups();
  pdraw(it.j);
  document.getElementById("p-jan").textContent = it.j;
  document.getElementById("p-posline").textContent = gLabel(it.g) + " ／ 上から" + it.t + "段目";
  document.getElementById("p-name").textContent = it.n || "";
  const vp = viewList.indexOf(pidx);
  document.getElementById("p-cnt").textContent = gLabel(it.g) + " " + (vp + 1) + "/" + viewList.length + " ・ 全体 " + (pidx + 1) + "/" + PRICE.length;
  const isDone = !!pdone[pidx];
  document.getElementById("p-card").classList.toggle("done", isDone);
  document.getElementById("p-doneflag").textContent = isDone ? "✓ 変更済み" : "";
  const db = document.getElementById("p-donebtn");
  db.textContent = isDone ? "✓ 済み（タップで戻す）" : "✓ 変更済みにする";
  db.classList.toggle("on", isDone);
  document.getElementById("p-donecnt").textContent = "済み " + Object.keys(pdone).length + "件";
  psave();
}
function pgo(d) { const vp = viewList.indexOf(pidx); const nv = Math.min(viewList.length - 1, Math.max(0, vp + d)); pidx = viewList[nv]; prender(); }
document.getElementById("p-next").addEventListener("click", () => pgo(1));
document.getElementById("p-prev").addEventListener("click", () => pgo(-1));
let ptx = null;
const pcard = document.getElementById("p-card");
pcard.addEventListener("touchstart", e => { ptx = e.changedTouches[0].clientX; }, { passive: true });
pcard.addEventListener("touchend", e => {
  if (ptx === null) return;
  const dx = e.changedTouches[0].clientX - ptx; ptx = null;
  if (dx < -45) pgo(1); else if (dx > 45) pgo(-1);
}, { passive: true });
document.getElementById("p-donebtn").addEventListener("click", () => { if (pdone[pidx]) delete pdone[pidx]; else pdone[pidx] = 1; prender(); });
function buildToc() {
  const body = document.getElementById("p-tocbody");
  let html = "", g = "";
  PRICE.forEach((it, i) => {
    const grp = gLabel(it.g) + " ／ 上から" + it.t + "段目";
    if (grp !== g) { g = grp; html += '<div class="tg">' + grp + "</div>"; }
    html += '<div class="ti' + (i === pidx ? " cur" : "") + '" data-i="' + i + '"><span class="no">' + (i + 1) + '</span><span class="jn">' + it.j + "</span><span>" + (it.n || "") + '</span>' + (pdone[i] ? '<span class="ck">✓済</span>' : "") + "</div>";
  });
  body.innerHTML = html;
  body.querySelectorAll(".ti").forEach(el => el.addEventListener("click", () => {
    pidx = +el.dataset.i; pgroup = PRICE[pidx].g; rebuildView(); prender();
    document.getElementById("p-toc").classList.remove("open");
  }));
}
document.getElementById("p-tocbtn").addEventListener("click", () => { buildToc(); document.getElementById("p-toc").classList.add("open"); });
document.getElementById("p-tocclose").addEventListener("click", () => document.getElementById("p-toc").classList.remove("open"));
if (navigator.wakeLock) { const req = () => navigator.wakeLock.request("screen").catch(() => {}); document.addEventListener("click", req, { once: true }); }
prender();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
</body>
