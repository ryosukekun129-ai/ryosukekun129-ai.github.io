<style>

  nav button.active { color: #fff; border-bottom-color: #f59e0b; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .view { display: none; } .view.active { display: block; }
  video { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 4/3; object-fit: cover; }

  .btn:active { opacity: .8; }
  input[type="text"], input[type="tel"] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid #d1d5db; border-radius: 12px; background: #fff; }
  .row { display: flex; gap: 8px; } .row .btn { margin: 0; }
  .hint { font-size: 13px; color: #6b7280; margin: 8px 0; line-height: 1.5; }
  #result, #result2 { margin-top: 12px; }
  .card { border-radius: 16px; padding: 14px 10px; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .card .cls { font-size: 22px; font-weight: 900; line-height: 1.2; }
  .card .name { font-size: 19px; font-weight: 700; margin-top: 8px; line-height: 1.4; }
  .card .jan { font-size: 14px; opacity: .85; margin-top: 2px; letter-spacing: .05em; }

  .shelf .stitle { font-weight: 800; font-size: 15px; margin-bottom: 6px; }
  .srow { display: flex; align-items: center; gap: 3px; margin-bottom: 4px; }

  .scell { flex: 1; height: 34px; background: #e5e7eb; border-radius: 5px; cursor: pointer; }
  .scell:active { opacity: .65; }
  .scell.hit { outline: 2px solid #111827; outline-offset: -1px; }
  .card.empty { background: #4b5563; }
  .c1 { background: #2563eb; } .c2 { background: #059669; } .c3 { background: #d97706; } .c4 { background: #dc2626; }
  .chips { display: flex; gap: 8px; margin: 4px 0 10px; flex-wrap: wrap; }
  .chip { padding: 9px 14px; border-radius: 999px; border: 2px solid #d1d5db; background: #fff; font-size: 14px; font-weight: 700; }
  .chip.active { background: #1f2937; color: #fff; border-color: #1f2937; }
  .group { font-size: 14px; font-weight: 900; color: #374151; margin: 16px 0 6px; }
  .item { background: #fff; border-radius: 10px; padding: 11px 12px; margin-bottom: 6px; display: flex; gap: 10px; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .item:active { background: #eef2ff; }
  .badge { flex: none; width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .item .nm { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .item .ps { font-size: 12px; color: #6b7280; margin-top: 1px; }
  #history { margin-top: 18px; }
  #history h2 { font-size: 15px; margin: 0 0 8px; }
  .hist { background: #fff; border-radius: 10px; padding: 9px 12px; margin-bottom: 5px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .hist .badge { width: 26px; height: 26px; font-size: 13px; }
  .hist time { color: #9ca3af; font-size: 11px; margin-left: auto; flex: none; }
  #nochimei { font-size: 14px; font-weight: 700; color: #dc2626; }
  #view-scan.active { display: flex; flex-direction: column; min-height: calc(100dvh - 132px); }
  #view-scan { padding-bottom: 118px; }
  .scan-bottom { margin-top: auto; padding-top: 18px; }
  #btn-ext { background: #059669; font-size: 21px; padding: 24px; margin: 0; width: auto; position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 25; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  /* 判定スキャン：模式図・バーコード・ゴンドラ選択 */
  #view-scan { touch-action: pan-y; }
  .bc-card { background: #fff; border-radius: 16px; padding: 16px 8px 10px; margin-top: 10px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  #s-bc { width: 94%; height: auto; display: none; margin: 0 auto; }
  #s-jan { font-family: ui-monospace, Menlo, monospace; font-size: 29px; font-weight: 800; letter-spacing: .12em; color: #111827; margin-top: 4px; }
  .card.p17 { background: #374151; }
  #g-buttons { margin-top: 12px; }

</head>
<body>
<header>
  <h1>棚割りアプリ</h1>
  <div class="sub">判定246件（2026-11-14受領資料）</div>
</header>
<nav>
  <button id="tab-scan" class="active">判定スキャン</button>
  <button id="tab-search">入力・検索</button>
  <button id="tab-list">判定一覧</button>
</nav>
<main>
  <section id="view-scan" class="view active">
    <div id="result"><div class="hint" style="font-size:15px;">まだ判定していません。下の「バーコードスキャン」ボタンで読み取ってください。</div></div>
    <div id="shelf-area"></div>
    <div class="bc-card">
      <canvas id="s-bc" width="570" height="240"></canvas>
      <div id="s-jan"></div>
      <div id="s-bcph" class="hint" style="margin:0;">商品を表示すると、ここにバーコードが出ます。</div>
    </div>
    <div class="chips" id="g-buttons"></div>
    <div id="history">
      <h2>スキャン履歴 <span id="nochimei"></span></h2>
      <div id="hist-list"><div class="hint">まだ履歴がありません。</div></div>
    </div>
    <div class="scan-bottom">
      <button class="btn" id="btn-ext">バーコードスキャン</button>
      <div class="hint">TeaCapps「QRコード＆バーコードリーダー」が開きます。読み取ると自動でこのアプリに戻り、結果が一番上に表示されます。</div>
    </div>
  </section>
  <section id="view-search" class="view">
    <div class="group" style="margin-top:2px;">JANで判定</div>
    <div class="row">
      <input type="tel" id="jan-input" inputmode="numeric" placeholder="JANコード（13桁）" maxlength="13">
      <button class="btn" id="btn-jan" style="width:110px; flex:none;">判定</button>
    </div>
    <div class="group">商品名で検索</div>
    <input type="text" id="name-input" placeholder="例：ムシューダ、カイロ、ホカロン">
    <div id="name-results" style="margin-top:10px;"></div>
    <div id="result2"></div>
  </section>
  <section id="view-list" class="view">
    <div class="chips">
      <button class="chip active" data-f="3">③ 両方（0）</button>
      <button class="chip" data-f="1">① オンのみ</button>
      <button class="chip" data-f="2">② オフのみ</button>
    </div>
    <div id="list-body"></div>
  </section>
</main>

    '<div class="pos">' + r.pos + '</div>' + shelves + '</div>';
  bindShelfNav(el, focus);
}
let suppressTapUntil = 0;
function navigate(el, kind, g, t, p) {
  const d = posIndex.get(kind + ":" + g + ":" + t + ":" + p);
  if (d) showResult(el, judge(d.j), { kind, g, t, p });
  else showEmpty(el, kind, g, t, p);
}
function showEmpty(el, kind, g, t, p) {
  const grids = kind === "on" ? ON_GRIDS : OFF_GRIDS;
  const label = kind === "on" ? "オン ゴンドラ" + g : "オフ" + g;
  const shelf = shelfHtml(kind, grids, [g, t, p], "#9ca3af", { kind, g, t, p });
  el.innerHTML = '<div class="card empty"><div class="cls">商品なし</div>' +
    '<div class="name">この位置に商品は置かれていません</div>' +
    '<div class="pos">' + label + " 上から" + t + "段目 左から" + p + "番目</div>" + shelf + '</div>';
  bindShelfNav(el, { kind, g, t, p });
}
function bindShelfNav(el, focus) {
  el._focus = focus;
  el.querySelectorAll(".shelf").forEach(sh => {
    const kind = sh.dataset.kind, g = +sh.dataset.g;
    const grids = kind === "on" ? ON_GRIDS : OFF_GRIDS;
    sh.querySelectorAll(".scell").forEach(cell => {
      cell.addEventListener("click", () => {
        if (Date.now() < suppressTapUntil) return;
        navigate(el, kind, g, +cell.dataset.t, +cell.dataset.p);
      });
    });
    let tx = null;
    sh.addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; }, { passive: true });
    sh.addEventListener("touchend", e => {
      if (tx === null) return;
      const dx = e.changedTouches[0].clientX - tx; tx = null;
      if (Math.abs(dx) < 40) return;
      suppressTapUntil = Date.now() + 400;
      const f = el._focus;
      let ct, cp;
      if (f && f.kind === kind && f.g === g) { ct = f.t; cp = f.p; }
      else { ct = +sh.dataset.ct; cp = +sh.dataset.cp; }
      const grid = grids[g];
      if (!grid) return;
      const cnt = grid[ct - 1];
      if (!cnt) return;
      const np = Math.min(cnt, Math.max(1, cp + (dx > 0 ? -1 : 1)));
      if (np !== cp) navigate(el, kind, g, ct, np);
    }, { passive: true });
  });
}
const histList = document.getElementById("hist-list");

function renderList(f) {

    return ka[0] - kb[0] || ka[1] - kb[1] || ka[2] - kb[2];
  });

/* ===== 判定スキャン：模式図・バーコード・ゴンドラ選択 ===== */
function ean13(jan) {
  const d = jan.split("").map(Number);
  const par = TABLES.P[d[0]];
  let bits = "101";
  for (let k = 1; k <= 6; k++) bits += TABLES[par[k - 1]][d[k]];
  bits += "01010";
  for (let k = 7; k <= 12; k++) bits += TABLES.R[d[k]];
  bits += "101";
  return bits;
}
function ean8(jan) {
  const d = jan.split("").map(Number);
  let bits = "101";
  for (let k = 0; k < 4; k++) bits += TABLES.L[d[k]];
  bits += "01010";
  for (let k = 4; k < 8; k++) bits += TABLES.R[d[k]];
  bits += "101";
  return bits;
}
function drawBarcode(jan) {
  const cv = document.getElementById("s-bc"), ph = document.getElementById("s-bcph"), jt = document.getElementById("s-jan");
  let bits = null, guard = null;
  if (/^\d{13}$/.test(jan || "")) { bits = ean13(jan); guard = i => (i < 3 || (i >= 46 && i < 50) || i >= 92); }
  else if (/^\d{8}$/.test(jan || "")) { bits = ean8(jan); guard = i => (i < 3 || (i >= 31 && i < 36) || i >= 64); }
  if (!bits) { cv.style.display = "none"; jt.textContent = ""; ph.style.display = "block"; return; }
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const quiet = 30, mw = (W - quiet * 2) / bits.length;
  ctx.fillStyle = "#000";
  for (let i = 0; i < bits.length; i++) {
    if (bits[i] === "1") ctx.fillRect(quiet + i * mw, 6, Math.ceil(mw), guard(i) ? H - 14 : H - 44);
  }
  cv.style.display = "block"; jt.textContent = jan; ph.style.display = "none";
}
const p17Index = new Map();
for (const it of P17.items) p17Index.set(it.t + ":" + it.p, it);
const SHELVES = [{"kind": "on", "g": 1, "label": "ゴンドラ1"}, {"kind": "on", "g": 2, "label": "ゴンドラ2"}, {"kind": "on", "g": 3, "label": "ゴンドラ3"}, {"kind": "off", "g": 1, "label": "オフ1"}, {"kind": "off", "g": 2, "label": "オフ2"}, {"kind": "off", "g": 3, "label": "オフ3"}, {"kind": "off", "g": 4, "label": "オフ4"}];
let scanShelf = { kind: "on", g: 1 };
let scanNav = null;
let scanJan = null;
function shelfGridHtml(kind, g, hl) {
  const grids = kind === "on" ? ON_GRIDS : kind === "off" ? OFF_GRIDS : { 0: P17.grid };
  const grid = grids[g];
  if (!grid) return "";
  const label = kind === "on" ? "オンの棚：ゴンドラ" + g : kind === "off" ? "オフの棚：オフ" + g : "資料p17の棚";
  let rows = "";
  grid.forEach((cnt, ri) => {
    let cells = "";
    for (let ci = 1; ci <= cnt; ci++) {
      const hit = hl && hl.t === ri + 1 && hl.p === ci;
      cells += '<span class="scell' + (hit ? " hit" : "") + '" data-t="' + (ri + 1) + '" data-p="' + ci + '"' + (hit ? ' style="background:#374151"' : "") + "></span>";
    }
    rows += '<div class="srow"><span class="slab">' + (ri + 1) + "段</span>" + cells + "</div>";
  });
  return '<div class="shelf" data-kind="' + kind + '" data-g="' + g + '"><div class="stitle">' + label + "</div>" + rows + "</div>";
}
function renderScanShelf() {
  const area = document.getElementById("shelf-area");
  const hl = (scanNav && scanNav.kind === scanShelf.kind && scanNav.g === scanShelf.g) ? scanNav : null;
  area.innerHTML = shelfGridHtml(scanShelf.kind, scanShelf.g, hl);
  const sh = area.querySelector(".shelf");
  if (sh) sh.querySelectorAll(".scell").forEach(cell => cell.addEventListener("click", () => {
    if (Date.now() < suppressTapUntil) return;
    scanGoto(scanShelf.kind, scanShelf.g, +cell.dataset.t, +cell.dataset.p);
  }));
  document.querySelectorAll("#g-buttons .chip").forEach(ch => {
    ch.classList.toggle("active", ch.dataset.kind === scanShelf.kind && +ch.dataset.g === scanShelf.g);
  });
}
function renderGButtons() {
  const box = document.getElementById("g-buttons");
  box.innerHTML = SHELVES.map(s => '<button class="chip" data-kind="' + s.kind + '" data-g="' + s.g + '">' + s.label + "</button>").join("");
  box.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
    scanShelf = { kind: ch.dataset.kind, g: +ch.dataset.g };
    scanNav = null;
    if (scanJan) {
      const d = byJan.get(scanJan);
      if (d) {
        const arr = scanShelf.kind === "on" ? d.o : scanShelf.kind === "off" ? d.f : null;
        if (arr) for (const a of arr) { if (a[0] === scanShelf.g) { scanNav = { kind: scanShelf.kind, g: scanShelf.g, t: a[1], p: a[2] }; break; } }
      }
    }
    renderScanShelf();
  }));
}
function scanCardHtml(r) {
  return '<div class="card c' + r.cls + '"><div class="cls">' + CLS[r.cls] + '</div>' +
    '<div class="name">' + r.name + '</div><div class="jan">' + r.jan + '</div>' +
    '<div class="pos">' + r.pos + "</div></div>";
}
function showScanResult(r) {
  scanJan = r.jan;
  if (r.o) { scanShelf = { kind: "on", g: r.o[0][0] }; scanNav = { kind: "on", g: r.o[0][0], t: r.o[0][1], p: r.o[0][2] }; }
  else if (r.f) { scanShelf = { kind: "off", g: r.f[0][0] }; scanNav = { kind: "off", g: r.f[0][0], t: r.f[0][1], p: r.f[0][2] }; }
  else scanNav = null;
  document.getElementById("result").innerHTML = scanCardHtml(r);
  drawBarcode(r.jan);
  renderScanShelf();
}
function scanGoto(kind, g, t, p) {
  scanShelf = { kind, g };
  scanNav = { kind, g, t, p };
  const resEl = document.getElementById("result");
  if (kind === "p17") {
    const it = p17Index.get(t + ":" + p);
    scanJan = it ? it.j : null;
    resEl.innerHTML = '<div class="card p17"><div class="cls">資料p17</div>' +
      '<div class="name">' + (it && it.n ? it.n : "（商品名なし）") + '</div><div class="jan">' + (it ? it.j : "") + "</div>" +
      '<div class="pos">資料p17 上から' + t + "段目 左から" + p + "番目</div></div>";
    drawBarcode(it ? it.j : "");
  } else {
    const d = posIndex.get(kind + ":" + g + ":" + t + ":" + p);
    if (d) {
      scanJan = d.j;
      resEl.innerHTML = scanCardHtml(judge(d.j));
      drawBarcode(d.j);
    } else {
      scanJan = null;
      const label = kind === "on" ? "オン ゴンドラ" + g : "オフ" + g;
      resEl.innerHTML = '<div class="card empty"><div class="cls">商品なし</div>' +
        '<div class="name">この位置に商品は置かれていません</div>' +
        '<div class="pos">' + label + " 上から" + t + "段目 左から" + p + "番目</div></div>";
      drawBarcode("");
    }
  }
  renderScanShelf();
}
/* 画面全体の左右スワイプで隣の商品へ（判定スキャンタブ） */
(function () {
  const view = document.getElementById("view-scan");
  let sx = null, sy = null;
  view.addEventListener("touchstart", e => {
    if (e.target.closest && e.target.closest("button, input")) { sx = null; return; }
    sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY;
  }, { passive: true });
  view.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (!scanNav) return;
    suppressTapUntil = Date.now() + 400;
    const grids = scanNav.kind === "on" ? ON_GRIDS : scanNav.kind === "off" ? OFF_GRIDS : { 0: P17.grid };
    const grid = grids[scanNav.g];
    if (!grid) return;
    const cnt = grid[scanNav.t - 1];
    if (!cnt) return;
    const np = Math.min(cnt, Math.max(1, scanNav.p + (dx > 0 ? -1 : 1)));
    if (np !== scanNav.p) scanGoto(scanNav.kind, scanNav.g, scanNav.t, np);
  }, { passive: true });
})();

  history.replaceState(null, "", location.pathname);
}
